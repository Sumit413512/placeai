[project]
name = "placeai"
version = "3.1.3"
description = "AI-assisted campus placement operating system"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.137.1",
  "uvicorn[standard]==0.49.0",
  "SQLAlchemy==2.0.51",
  "alembic==1.16.5",
  "psycopg[binary]==3.2.10",
  "python-multipart==0.0.32",
  "python-dotenv==1.2.2",
  "argon2-cffi==25.1.0",
  "google-genai==2.8.0",
  "google-auth==2.55.0",
  "pypdf==6.18.0",
  "httpx==0.28.1",
  "aiofiles==25.1.0",
  "email-validator==2.3.0",
  "qrcode[pil]==8.2",
  "openpyxl==3.1.5",
  "reportlab==4.4.9",
]

[tool.fastapi]
entrypoint = "app.app:app"

[tool.vercel]
entrypoint = "app.app:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
