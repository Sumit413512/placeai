services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: placeai
      POSTGRES_USER: placeai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placeai -d placeai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ${APP_NAME:-PlaceAI}
      ENVIRONMENT: production
      AUTO_CREATE_SCHEMA: "false"
      DATABASE_URL: postgresql+psycopg://placeai:${POSTGRES_PASSWORD}@db:5432/placeai
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:?Set JWT_REFRESH_SECRET_KEY in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      PUBLIC_RECRUITER_SIGNUP: "false"
      ALLOW_TALENT_POOL_SEARCH: ${ALLOW_TALENT_POOL_SEARCH:-false}
      ENABLE_AI_DEMO_FALLBACK: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - resume_data:/app/uploads/resumes
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  resume_data:
