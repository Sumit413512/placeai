name: PlaceAI Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: placeai-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://www.placeai.in
      BACKEND_URL: https://www.placeai.in
    steps:
      - name: Wait for canonical production application
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "$BASE_URL/health" || true)
            if [ "$code" = "200" ]; then
              python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/health.json').read_text(encoding='utf-8'))
          required = {
              'status': 'healthy', 'database': 'ok', 'configuration': 'ok',
              'transactional_email': 'ok',
          }
          bad = {key: (payload.get(key), expected) for key, expected in required.items() if payload.get(key) != expected}
          if bad:
              raise SystemExit(f'Production health contract failed: {bad}; payload={payload}')
          print('Canonical production health contract passed.')
          PY
              exit 0
            fi
            echo "Canonical production application not ready yet (attempt $attempt/24, HTTP $code)."
            sleep 10
          done
          echo 'Canonical production health endpoint did not become healthy in time.' >&2
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Verify production API directly
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 30 -D /tmp/vercel-health.headers -o /tmp/vercel-health.json "$BACKEND_URL/health"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/vercel-health.json').read_text(encoding='utf-8'))
          required = {
              'status': 'healthy',
              'database': 'ok',
              'configuration': 'ok',
              'transactional_email': 'ok',
          }
          bad = {key: (payload.get(key), expected) for key, expected in required.items() if payload.get(key) != expected}
          if bad:
              raise SystemExit(f'Vercel backend health contract failed: {bad}; payload={payload}')
          if not isinstance(payload.get('version'), str) or not payload['version'].strip():
              raise SystemExit(f'Vercel backend version missing: {payload}')
          print('Vercel backend health contract passed; version=', payload['version'])
          PY
          grep -qi '^strict-transport-security:' /tmp/vercel-health.headers
          grep -qi '^x-content-type-options: *nosniff' /tmp/vercel-health.headers
          grep -qi '^x-frame-options: *DENY' /tmp/vercel-health.headers
          grep -qi '^cache-control: *no-store' /tmp/vercel-health.headers

          curl -fsS --connect-timeout 10 --max-time 20 "$BACKEND_URL/ai/status" -o /tmp/vercel-ai-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/vercel-ai-status.json').read_text(encoding='utf-8'))
          expected = {'configured', 'sdk_available', 'model'}
          if set(payload) != expected:
              raise SystemExit(f'Unexpected direct-backend AI status fields: {sorted(payload)}')
          if not isinstance(payload.get('configured'), bool) or not isinstance(payload.get('sdk_available'), bool):
              raise SystemExit(f'Direct-backend AI readiness booleans invalid: {payload}')
          if not isinstance(payload.get('model'), str) or not payload['model'].strip():
              raise SystemExit(f'Direct-backend AI model value invalid: {payload}')
          print('Direct Vercel AI readiness contract passed; configured=', payload['configured'])
          PY

          me_code=$(curl -sS -o /tmp/vercel-me.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "$BACKEND_URL/auth/me")
          test "$me_code" = '401'
          jobs_code=$(curl -sS -o /tmp/vercel-jobs.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "$BACKEND_URL/jobs")
          test "$jobs_code" = '401'
          drives_code=$(curl -sS -o /tmp/vercel-drives.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "$BACKEND_URL/enterprise/drives")
          test "$drives_code" = '401'
          dashboard_code=$(curl -sS -o /tmp/vercel-dashboard.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "$BACKEND_URL/institutions/dashboard")
          test "$dashboard_code" = '401'

      - name: Verify public shell, legal surface, release assets and security headers
        shell: bash
        run: |
          set -euo pipefail
          head_code=$(curl -sS -o /dev/null -w '%{http_code}' -I --connect-timeout 10 --max-time 20 "$BASE_URL/")
          test "$head_code" = '200'
          curl -L -sS --fail --connect-timeout 10 --max-time 20 -D /tmp/root.headers -o /tmp/root.html "$BASE_URL/"
          grep -qi '<title>PlaceAI' /tmp/root.html
          grep -qi '^strict-transport-security:' /tmp/root.headers
          grep -qi '^content-security-policy:' /tmp/root.headers
          grep -qi '^x-content-type-options: *nosniff' /tmp/root.headers
          grep -qi '^x-frame-options: *DENY' /tmp/root.headers
          grep -qi '^referrer-policy: *strict-origin-when-cross-origin' /tmp/root.headers
          grep -q '/static/app.js' /tmp/root.html
          curl -fsS --connect-timeout 10 --max-time 20 "$BASE_URL/static/app.js" -o /tmp/app-bootstrap.js
          grep -q 'provisioning-password-fix.js' /tmp/app-bootstrap.js
          grep -q 'ai-readiness.js' /tmp/app-bootstrap.js
          grep -q 'legal-links.js' /tmp/app-bootstrap.js
          curl -fsS --connect-timeout 10 --max-time 20 "$BASE_URL/favicon.ico" -o /tmp/favicon.svg
          curl -fsS --connect-timeout 10 --max-time 20 "$BASE_URL/static/api-errors.js" -o /tmp/api-errors.js
          grep -q 'PASSWORD_POLICY_HELP' /tmp/api-errors.js
          grep -q 'FORM_CONTRACTS' /tmp/api-errors.js
          grep -q "'admin-form'" /tmp/api-errors.js
          grep -q "'institution-student-form'" /tmp/api-errors.js
          grep -q "'institution-recruiter-form'" /tmp/api-errors.js
          curl -fsS --connect-timeout 10 --max-time 20 "$BASE_URL/static/provisioning-password-fix.js" -o /tmp/provisioning-password-fix.js
          grep -q 'AUTO_TEMP_PASSWORD_FIX_V1' /tmp/provisioning-password-fix.js
          grep -q 'secureTemporaryPassword' /tmp/provisioning-password-fix.js
          grep -q 'data-temp-password-regenerate' /tmp/provisioning-password-fix.js
          curl -fsS --connect-timeout 10 --max-time 20 "$BASE_URL/static/app-core.js" -o /tmp/app-core.js
          grep -q 'data-access-request-status' /tmp/app-core.js
          curl -fsS --connect-timeout 10 --max-time 20 "$BASE_URL/static/release-ux-fixes.js" -o /tmp/release-ux-fixes.js
          grep -q '/provision-recruiter' /tmp/release-ux-fixes.js
          ! grep -q "'/platform/recruiters'" /tmp/release-ux-fixes.js
          ! grep -q "'/auth/forgot-password'" /tmp/release-ux-fixes.js
          curl -fsS --connect-timeout 10 --max-time 20 "$BASE_URL/static/integration-readiness.js" -o /tmp/integration-readiness.js
          grep -q 'Transactional email' /tmp/integration-readiness.js
          grep -q 'Brevo HTTPS API' /tmp/integration-readiness.js
          curl -fsS --connect-timeout 10 --max-time 20 "$BASE_URL/static/ai-readiness.js" -o /tmp/ai-readiness.js
          grep -q 'PlaceAIAIReadiness' /tmp/ai-readiness.js
          grep -q 'AI_ACTIONS' /tmp/ai-readiness.js
          curl -fsS --connect-timeout 10 --max-time 20 "$BASE_URL/static/legal-links.js" -o /tmp/legal-links.js
          grep -q '/privacy' /tmp/legal-links.js
          grep -q '/terms' /tmp/legal-links.js
          grep -q '/acceptable-use' /tmp/legal-links.js
          curl -fsS --connect-timeout 10 --max-time 20 "$BASE_URL/privacy" -o /tmp/privacy.html
          grep -qi '<title>Privacy Policy — PlaceAI</title>' /tmp/privacy.html
          curl -fsS --connect-timeout 10 --max-time 20 "$BASE_URL/terms" -o /tmp/terms.html
          grep -qi '<title>Terms of Use — PlaceAI</title>' /tmp/terms.html
          curl -fsS --connect-timeout 10 --max-time 20 "$BASE_URL/acceptable-use" -o /tmp/aup.html
          grep -qi '<title>Acceptable Use — PlaceAI</title>' /tmp/aup.html
          curl -fsS --connect-timeout 10 --max-time 20 "$BASE_URL/robots.txt" -o /tmp/robots.txt
          grep -q '^Sitemap:' /tmp/robots.txt
          curl -fsS --connect-timeout 10 --max-time 20 "$BASE_URL/sitemap.xml" -o /tmp/sitemap.xml
          grep -q '/privacy' /tmp/sitemap.xml
          grep -q '/terms' /tmp/sitemap.xml
          grep -q '/acceptable-use' /tmp/sitemap.xml

      - name: Verify AI readiness contract is safe
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 20 "$BASE_URL/ai/status" -o /tmp/ai-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/ai-status.json').read_text(encoding='utf-8'))
          expected = {'configured', 'sdk_available', 'model'}
          if set(payload) != expected:
              raise SystemExit(f'Unexpected AI status fields: {sorted(payload)}')
          if not isinstance(payload.get('configured'), bool) or not isinstance(payload.get('sdk_available'), bool):
              raise SystemExit(f'AI readiness booleans invalid: {payload}')
          if not isinstance(payload.get('model'), str) or not payload['model'].strip():
              raise SystemExit(f'AI model readiness value invalid: {payload}')
          print('AI readiness contract is privacy-safe; configured=', payload['configured'])
          PY

      - name: Verify unauthenticated auth boundaries
        shell: bash
        run: |
          set -euo pipefail
          refresh_code=$(curl -sS -o /tmp/refresh.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' "$BASE_URL/auth/refresh")
          test "$refresh_code" = '401'
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/refresh.json').read_text(encoding='utf-8'))
          if payload.get('detail') != 'Refresh token is required':
              raise SystemExit(f'Unexpected refresh response: {payload}')
          PY
          me_code=$(curl -sS -o /tmp/me.json -w '%{http_code}' "$BASE_URL/auth/me")
          test "$me_code" = '401'

      - name: Verify password-reset failure contract
        shell: bash
        run: |
          set -euo pipefail
          reset_code=$(curl -sS -o /tmp/reset.json -w '%{http_code}' --max-time 30 -X POST "$BASE_URL/auth/reset-password" -H 'Content-Type: application/json' --data '{"token":"invalid-production-smoke-token-000000000000000000000000000000000000","new_password":"ProductionSmokeOnly!123"}')
          case "$reset_code" in
            400|422|429) ;;
            *) echo "Unexpected password-reset probe status: $reset_code" >&2; cat /tmp/reset.json; exit 1 ;;
          esac
          if grep -q 'Unexpected server error' /tmp/reset.json; then
            echo 'Reset endpoint leaked an unexpected server error.' >&2
            cat /tmp/reset.json
            exit 1
          fi

      - name: Record smoke evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "Production smoke passed for canonical application $BASE_URL"
          python - <<'PY'
          import json
          from pathlib import Path
          gateway = json.loads(Path('/tmp/health.json').read_text(encoding='utf-8'))
          backend = json.loads(Path('/tmp/vercel-health.json').read_text(encoding='utf-8'))
          safe_gateway = {key: gateway.get(key) for key in ('status','gateway','upstream','database','configuration','transactional_email')}
          safe_backend = {key: backend.get(key) for key in ('status','service','version','database','configuration','transactional_email')}
          print('gateway=', json.dumps(safe_gateway, sort_keys=True))
          print('backend=', json.dumps(safe_backend, sort_keys=True))
          PY
