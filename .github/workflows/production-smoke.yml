name: PlaceAI Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: placeai-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIMARY_URL: https://placeai-rxpp.vercel.app
      WORKSPACE_URL: https://placeai-rxpp.vercel.app/workspace
      FALLBACK_URL: https://placeai-recovery.onrender.com
      EXPECTED_VERSION: 3.1.4
    steps:
      - name: Wait for Vercel production backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code=$(curl -fsS -o /tmp/health.json -w '%{http_code}' --connect-timeout 10 --max-time 25 "$PRIMARY_URL/health" || true)
            if [ "$code" = "200" ]; then
              if python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path('/tmp/health.json').read_text(encoding='utf-8'))
          required = {
              'status': 'healthy', 'database': 'ok', 'configuration': 'ok',
              'transactional_email': 'ok', 'version': os.environ['EXPECTED_VERSION'],
          }
          bad = {k: (payload.get(k), v) for k, v in required.items() if payload.get(k) != v}
          if bad:
              raise SystemExit(f'waiting for exact production release: {bad}')
          print('Exact Vercel production backend release is healthy.')
          PY
              then exit 0; fi
            fi
            echo "Vercel production not on expected healthy release yet (attempt $attempt/30, HTTP $code)."
            sleep 10
          done
          echo 'Vercel production did not reach the expected release in time.' >&2
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Verify production public site and workspace
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -D /tmp/root.headers -o /tmp/root.html --connect-timeout 10 --max-time 25 "$PRIMARY_URL/"
          grep -qi '<title>PlaceAI' /tmp/root.html
          grep -qi '^strict-transport-security:' /tmp/root.headers
          grep -qi '^content-security-policy:' /tmp/root.headers
          grep -qi '^x-content-type-options: *nosniff' /tmp/root.headers
          grep -qi '^x-frame-options: *DENY' /tmp/root.headers

          curl -fsS -D /tmp/workspace.headers -o /tmp/workspace.html --connect-timeout 10 --max-time 25 "$WORKSPACE_URL"
          grep -qi '<title>PlaceAI — Campus placement operations</title>' /tmp/workspace.html
          grep -q '/static/workspace-runtime.js' /tmp/workspace.html
          grep -q '/static/release-ux-fixes.js' /tmp/workspace.html
          grep -q '/static/provisioning-password-fix.js' /tmp/workspace.html
          grep -q '/static/integration-readiness.js' /tmp/workspace.html
          grep -q '/static/ai-readiness.js' /tmp/workspace.html
          grep -q '/static/legal-links.js' /tmp/workspace.html
          grep -q '/static/app.js' /tmp/workspace.html
          grep -qi '^cache-control: *no-store' /tmp/workspace.headers

          curl -fsS "$PRIMARY_URL/pages/assets/placeai-pages.js" -o /tmp/pages.js
          grep -Fq "new URL('/workspace', window.location.origin)" /tmp/pages.js

          curl -fsS "$PRIMARY_URL/static/release-ux-fixes.js" -o /tmp/release-ux.js
          grep -q 'data-provision-recruiter-request' /tmp/release-ux.js
          grep -q 'secureTemporaryPassword' /tmp/release-ux.js
          curl -fsS "$PRIMARY_URL/static/provisioning-password-fix.js" -o /tmp/provisioning.js
          grep -q 'AUTO_TEMP_PASSWORD_FIX_V1' /tmp/provisioning.js
          curl -fsS "$PRIMARY_URL/static/ai-readiness.js" -o /tmp/ai-readiness.js
          grep -q 'PlaceAIAIReadiness' /tmp/ai-readiness.js

          curl -fsS "$PRIMARY_URL/privacy" -o /tmp/privacy.html
          grep -qi '<title>Privacy Policy — PlaceAI</title>' /tmp/privacy.html
          curl -fsS "$PRIMARY_URL/terms" -o /tmp/terms.html
          grep -qi '<title>Terms of Use — PlaceAI</title>' /tmp/terms.html
          curl -fsS "$PRIMARY_URL/acceptable-use" -o /tmp/aup.html
          grep -qi '<title>Acceptable Use — PlaceAI</title>' /tmp/aup.html
          curl -fsS "$PRIMARY_URL/mock-interview" -o /tmp/mock.html
          grep -qi '<title>.*PlaceAI' /tmp/mock.html

      - name: Verify AI provider readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 20 "$PRIMARY_URL/ai/status" -o /tmp/ai-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/ai-status.json').read_text(encoding='utf-8'))
          if set(payload) != {'configured', 'sdk_available', 'model'}:
              raise SystemExit(f'Unexpected AI readiness contract: {payload}')
          if payload.get('configured') is not True or payload.get('sdk_available') is not True:
              raise SystemExit(f'AI provider is not production-ready: {payload}')
          if not isinstance(payload.get('model'), str) or not payload['model'].strip():
              raise SystemExit(f'AI model is missing: {payload}')
          print('AI provider is configured and SDK-ready; model=', payload['model'])
          PY

      - name: Verify unauthenticated authorization boundaries
        shell: bash
        run: |
          set -euo pipefail
          refresh_code=$(curl -sS -o /tmp/refresh.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' "$PRIMARY_URL/auth/refresh")
          test "$refresh_code" = '401'
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/refresh.json').read_text(encoding='utf-8'))
          if payload.get('detail') != 'Refresh token is required':
              raise SystemExit(f'Unexpected refresh boundary: {payload}')
          PY
          for path in /auth/me /jobs /enterprise/drives /institutions/dashboard; do
            code=$(curl -sS -o /tmp/auth-boundary.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "$PRIMARY_URL$path")
            test "$code" = '401'
          done

      - name: Verify password reset failure contract
        shell: bash
        run: |
          set -euo pipefail
          reset_code=$(curl -sS -o /tmp/reset.json -w '%{http_code}' --max-time 30 -X POST "$PRIMARY_URL/auth/reset-password" -H 'Content-Type: application/json' --data '{"token":"invalid-production-smoke-token-000000000000000000000000000000000000","new_password":"ProductionSmokeOnly!123"}')
          case "$reset_code" in
            400|422|429) ;;
            *) echo "Unexpected password-reset probe status: $reset_code" >&2; cat /tmp/reset.json; exit 1 ;;
          esac
          if grep -q 'Unexpected server error' /tmp/reset.json; then
            echo 'Reset endpoint leaked an unexpected server error.' >&2
            cat /tmp/reset.json
            exit 1
          fi

      - name: Check Render fallback availability
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 25 "$FALLBACK_URL/_recovery/health" -o /tmp/fallback.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/fallback.json').read_text(encoding='utf-8'))
          if payload.get('status') != 'healthy' or payload.get('gateway') != 'ok':
              raise SystemExit(f'Render fallback is degraded: {payload}')
          print('Render fallback remains available.')
          PY

      - name: Record production evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('/tmp/health.json').read_text(encoding='utf-8'))
          ai = json.loads(Path('/tmp/ai-status.json').read_text(encoding='utf-8'))
          safe_health = {k: health.get(k) for k in ('status','service','version','database','configuration','transactional_email')}
          safe_ai = {k: ai.get(k) for k in ('configured','sdk_available','model')}
          print('primary=', json.dumps(safe_health, sort_keys=True))
          print('ai=', json.dumps(safe_ai, sort_keys=True))
          print('workspace=https://placeai-rxpp.vercel.app/workspace')
          PY
