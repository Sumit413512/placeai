name: PlaceAI Production Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/production-smoke.yml"
      - "MANIFEST.sha256"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: placeai-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify public production root and database health
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check production deployment
        env:
          PLACEAI_PRODUCTION_URL: https://placeai-rxpp-git-main-skj1200519-gmailcoms-projects.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          base="${PLACEAI_PRODUCTION_URL%/}"
          diag_dir="${RUNNER_TEMP}/placeai-smoke"
          mkdir -p "${diag_dir}"
          root_body="${diag_dir}/root-body.txt"
          health_body="${diag_dir}/health-body.txt"
          summary="${diag_dir}/summary.txt"
          sha256sum .github/workflows/production-smoke.yml > "${diag_dir}/workflow.sha256"
          : > "${root_body}"
          : > "${health_body}"
          : > "${summary}"

          is_vercel_protection() {
            grep -Eqi 'sso-api|Continue with (GitHub|Google|ChatGPT)|Vercel Authentication|/signup\?next=.*sso-api' "$1"
          }

          echo "Checking ${base}"
          echo "base=${base}" >> "${summary}"
          root_meta="$(curl --location --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --output "${root_body}" --write-out '%{http_code}|%{content_type}' \
            "${base}/" || true)"
          root_code="${root_meta%%|*}"
          root_type="${root_meta#*|}"
          echo "Root HTTP status: ${root_code}; content-type: ${root_type}"
          echo "root_http=${root_code}" >> "${summary}"
          echo "root_content_type=${root_type}" >> "${summary}"

          if is_vercel_protection "${root_body}"; then
            echo "vercel_deployment_protection=true" >> "${summary}"
            echo "::error::Vercel Deployment Protection is intercepting the PlaceAI production URL. The canonical user-facing application must be publicly reachable before this gate can pass."
            exit 1
          fi
          if [[ "${root_code}" != "200" ]]; then
            echo "::error::PlaceAI production root returned HTTP ${root_code}"
            sed -n '1,40p' "${root_body}" || true
            exit 1
          fi

          # A Git push and production alias promotion can race. Poll the JSON health
          # endpoint, but stop immediately if Vercel protection intercepts it.
          for attempt in $(seq 1 24); do
            health_meta="$(curl --location --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              --output "${health_body}" --write-out '%{http_code}|%{content_type}' \
              "${base}/health" || true)"
            health_code="${health_meta%%|*}"
            health_type="${health_meta#*|}"
            echo "Health attempt ${attempt}/24: HTTP ${health_code}; content-type: ${health_type}"
            echo "health_attempt_${attempt}=${health_code}|${health_type}" >> "${summary}"

            if is_vercel_protection "${health_body}"; then
              echo "vercel_deployment_protection=true" >> "${summary}"
              echo "::error::Vercel Deployment Protection intercepted /health. This is an access-policy failure, not a PlaceAI health response."
              exit 1
            fi

            if [[ "${health_code}" == "200" && "${health_type}" == application/json* ]]; then
              if python - "${health_body}" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          expected = {
              "status": "healthy",
              "service": "PlaceAI",
              "version": "3.1.3",
              "database": "ok",
          }
          missing = {
              key: (payload.get(key), value)
              for key, value in expected.items()
              if payload.get(key) != value
          }
          if missing:
              raise SystemExit(f"Unexpected health payload: {payload!r}; mismatches={missing!r}")
          print("Verified health payload:", payload)
          PY
              then
                echo "health_verified=true" >> "${summary}"
                exit 0
              fi
            fi

            if [[ "${attempt}" -lt 24 ]]; then
              sleep 10
            fi
          done

          echo "health_verified=false" >> "${summary}"
          echo "::error::PlaceAI production /health did not become healthy JSON"
          echo "Last response:"
          sed -n '1,80p' "${health_body}" || true
          exit 1

      - name: Preserve smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placeai-production-smoke-diagnostics
          path: ${{ runner.temp }}/placeai-smoke
          if-no-files-found: error
          retention-days: 7
