name: PlaceAI Production Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/production-smoke.yml"
      - "MANIFEST.sha256"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: placeai-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify public production root and database health
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check production deployment
        env:
          PLACEAI_PRODUCTION_URL: https://placeai-rxpp.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          base="${PLACEAI_PRODUCTION_URL%/}"
          diag_dir="${RUNNER_TEMP}/placeai-smoke"
          mkdir -p "${diag_dir}"
          root_body="${diag_dir}/root-body.txt"
          health_body="${diag_dir}/health-body.txt"
          summary="${diag_dir}/summary.txt"
          sha256sum .github/workflows/production-smoke.yml > "${diag_dir}/workflow.sha256"
          : > "${root_body}"
          : > "${health_body}"
          : > "${summary}"

          is_vercel_protection() {
            grep -Eqi 'sso-api|Continue with (GitHub|Google|ChatGPT)|Vercel Authentication|/signup\?next=.*sso-api' "$1"
          }

          echo "Checking ${base}"
          root_meta="$(curl --location --silent --show-error --connect-timeout 10 --max-time 20 --output "${root_body}" --write-out '%{http_code}|%{content_type}' "${base}/" || true)"
          root_code="${root_meta%%|*}"
          root_type="${root_meta#*|}"
          echo "Root HTTP status: ${root_code}; content-type: ${root_type}"
          echo "root_http=${root_code}" >> "${summary}"
          if is_vercel_protection "${root_body}"; then
            echo "::error::Vercel Deployment Protection is intercepting the canonical production URL."
            exit 1
          fi
          if [[ "${root_code}" != "200" ]]; then
            echo "::error::PlaceAI production root returned HTTP ${root_code}"
            sed -n '1,60p' "${root_body}" || true
            exit 1
          fi

          health_meta="$(curl --location --silent --show-error --connect-timeout 10 --max-time 20 --output "${health_body}" --write-out '%{http_code}|%{content_type}' "${base}/health" || true)"
          health_code="${health_meta%%|*}"
          health_type="${health_meta#*|}"
          echo "Health HTTP status: ${health_code}; content-type: ${health_type}"
          echo "health_http=${health_code}" >> "${summary}"
          echo "Health payload:"
          cat "${health_body}" || true

          if is_vercel_protection "${health_body}"; then
            echo "::error::Vercel Deployment Protection intercepted /health."
            exit 1
          fi
          if [[ "${health_code}" != "200" || "${health_type}" != application/json* ]]; then
            echo "::error::PlaceAI production /health is not healthy JSON"
            exit 1
          fi

          python - "${health_body}" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          expected = {"status": "healthy", "service": "PlaceAI", "version": "3.1.3", "database": "ok"}
          mismatches = {k: (payload.get(k), v) for k, v in expected.items() if payload.get(k) != v}
          if mismatches:
              raise SystemExit(f"Unexpected health payload: {payload!r}; mismatches={mismatches!r}")
          print("Verified health payload:", payload)
          PY

      - name: Preserve smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placeai-production-smoke-diagnostics
          path: ${{ runner.temp }}/placeai-smoke
          if-no-files-found: error
          retention-days: 7
