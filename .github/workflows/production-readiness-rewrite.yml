name: Production Readiness Rewrite

on:
  push:
    branches: [fix/production-readiness-20260912]
    paths: [.github/workflows/production-readiness-rewrite.yml]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-readiness-20260912
      - name: Normalize safe production ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          # Never expose raw AI/provider content in client-facing parse errors.
          path = Path('app/routers/ai.py')
          text = path.read_text()
          old = '''    except json.JSONDecodeError as e:\n        raise HTTPException(\n            status_code=status.HTTP_502_BAD_GATEWAY,\n            detail=f"Failed to parse AI response as JSON: {str(e)}. Raw: {text[:300]}"\n        )'''
          new = '''    except json.JSONDecodeError:\n        raise HTTPException(\n            status_code=status.HTTP_502_BAD_GATEWAY,\n            detail="AI service returned an invalid structured response."\n        )'''
          if old not in text:
              raise SystemExit('AI parse-error source shape changed')
          path.write_text(text.replace(old, new, 1))

          # Keep mock interview history in its natural canonical router and remove
          # the compatibility-layer duplicate.
          compat = Path('app/routers/interview_compat.py')
          text = compat.read_text()
          marker = '@router.get("/mock-interview/history")'
          if marker not in text:
              raise SystemExit('mock interview compatibility route not found')
          text = text[:text.index(marker)].rstrip() + '\n'
          compat.write_text(text)

          app = Path('app/app.py')
          text = app.read_text()
          old = '''if mock_interview is not None:\n    mock_interview.router.routes = [\n        route for route in mock_interview.router.routes\n        if getattr(route, "path", "") != "/mock-interview/history"\n    ]\n\n'''
          if old not in text:
              raise SystemExit('mock interview bootstrap filter not found')
          app.write_text(text.replace(old, '', 1))
          PY
      - name: Refresh release manifest
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              MANIFEST.sha256|.github/workflows/production-readiness-rewrite.yml) continue ;;
            esac
            sha256sum "$file"
          done > MANIFEST.sha256
      - name: Commit normalized source
        run: |
          git config user.name "placeai-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/routers/ai.py app/routers/interview_compat.py app/app.py MANIFEST.sha256
          git commit -m "fix: normalize recovery and compatibility hardening"
          git push
