name: Canonical Router Test Reference Fix

on:
  push:
    branches: [fix/canonical-router-ownership-20260912]
    paths: [.github/workflows/canonical-router-test-fix.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-router-ownership-20260912
      - name: Point regression tests at canonical AI owner
        run: |
          sed -i 's/import app\.routers\.hardening as hardening_router/import app.routers.ai as ai_router/' tests/test_production_hardening_batch31.py
          sed -i 's/hardening_router/ai_router/g' tests/test_production_hardening_batch31.py
      - name: Refresh manifest
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              MANIFEST.sha256|.github/workflows/canonical-router-test-fix.yml) continue ;;
            esac
            [ -f "$file" ] || continue
            sha256sum "$file"
          done > MANIFEST.sha256
      - name: Commit test compatibility update
        run: |
          git config user.name "placeai-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_production_hardening_batch31.py MANIFEST.sha256
          git commit -m "test: follow canonical AI router ownership"
          git push
