name: Vercel Production Runtime Smoke

on:
  push:
    branches:
      - diagnostic/vercel-runtime-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe known production aliases
        id: probe
        shell: bash
        run: |
          set -u
          : > /tmp/smoke-result.txt

          probe() {
            label="$1"
            base="$2"
            out="/tmp/${label}.body"
            headers="/tmp/${label}.headers"
            code=$(curl -sS --connect-timeout 10 --max-time 30 -D "$headers" -o "$out" -w '%{http_code}' "$base/health" || printf '000')
            printf '%s_HTTP_STATUS=%s\n' "$label" "$code" | tee -a /tmp/smoke-result.txt
            printf '%s\n' "--- ${label} HEADERS ---" >> /tmp/smoke-result.txt
            cat "$headers" >> /tmp/smoke-result.txt 2>/dev/null || true
            printf '%s\n' "--- ${label} BODY (first 2000 bytes) ---" >> /tmp/smoke-result.txt
            head -c 2000 "$out" >> /tmp/smoke-result.txt 2>/dev/null || true
            printf '\n' >> /tmp/smoke-result.txt
          }

          probe BRANCH_ALIAS "https://placeai-rxpp-git-main-skj1200519-gmailcoms-projects.vercel.app"
          probe PROJECT_ALIAS "https://placeai-rxpp.vercel.app"

          ok=false
          project_code=$(grep '^PROJECT_ALIAS_HTTP_STATUS=' /tmp/smoke-result.txt | cut -d= -f2)
          if [ "$project_code" = "200" ]; then
            if python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/PROJECT_ALIAS.body').read_text())
          assert payload.get('service') == 'PlaceAI', payload
          assert payload.get('version') == '3.1.3', payload
          assert payload.get('status') == 'healthy', payload
          assert payload.get('database') == 'ok', payload
          PY
            then
              ok=true
              echo 'PLACEAI_RUNTIME_SMOKE=PASS' | tee -a /tmp/smoke-result.txt
            fi
          fi
          echo "smoke_ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Upload runtime diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-runtime-smoke
          path: /tmp/smoke-result.txt
          if-no-files-found: error
          retention-days: 1

      - name: Enforce public healthy production runtime
        if: always()
        shell: bash
        run: |
          test "${{ steps.probe.outputs.smoke_ok }}" = "true"
