name: PlaceAI Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned audit tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Tracked secret hygiene
        run: python scripts/secret_hygiene.py

      - name: Bandit application security scan
        run: bandit -r app scripts -ll -ii

      - name: Audit production dependencies
        run: pip-audit -r requirements.txt --progress-spinner off
