name: PlaceAI batch 42 API error contract

on:
  push:
    branches:
      - fix/api-error-contract-batch42

permissions:
  contents: write

jobs:
  transform-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/api-error-contract-batch42
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply shared API error contract
        run: python scripts/batch42_api_error_contract.py
      - name: Refresh release manifest entries
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          targets = [
              'app/app.py',
              'app/static/api-errors.css',
              'app/static/api-errors.js',
              'app/static/app.js',
              'app/static/access-portal.js',
              'app/static/account-security.js',
              'app/static/mock-interview.js',
              'app/templates/mock-interview.html',
              'tests/test_api_error_contract.py',
          ]
          manifest = Path('MANIFEST.sha256')
          lines = manifest.read_text(encoding='utf-8').splitlines()
          entries = {}
          for line in lines:
              if '  ' in line:
                  _, path = line.split('  ', 1)
                  entries[path] = line
          for path in targets:
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              entries[path] = f'{digest}  {path}'
          manifest.write_text('\n'.join(entries[path] for path in sorted(entries)) + '\n', encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Verify generated changes
        run: |
          set -euo pipefail
          sha256sum -c MANIFEST.sha256
          python -m compileall -q app tests alembic
          node --check app/static/api-errors.js
          node --check app/static/app.js
          node --check app/static/access-portal.js
          node --check app/static/account-security.js
          node --check app/static/mock-interview.js
          ruff check app tests alembic --select E9,F63,F7,F82
          pytest -q
          git diff --check
      - name: Commit generated hardening
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "PlaceAI Hardening Bot"
          git config user.email "placeai-hardening@users.noreply.github.com"
          git add MANIFEST.sha256 app/app.py app/static/api-errors.css app/static/api-errors.js app/static/app.js app/static/access-portal.js app/static/account-security.js app/static/mock-interview.js app/templates/mock-interview.html tests/test_api_error_contract.py
          git commit -m "Standardize frontend API validation errors"
          git push origin HEAD:fix/api-error-contract-batch42
