name: PlaceAI batch 40 transformer fix

on:
  push:
    branches:
      - fix/password-reset-observability-batch40

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/password-reset-observability-batch40
      - name: Normalize transformer output
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/batch40_email_observability.py')
          text = path.read_text(encoding='utf-8')

          old_brace = 'block = block[:close] + integration_branch + "\\n  }" + block[close + len("\\n    }\\n  }"):]'
          new_brace = 'block = block[:close] + integration_branch + "\\n    }\\n  }" + block[close + len("\\n    }\\n  }"):]'
          if old_brace in text:
              text = text.replace(old_brace, new_brace, 1)

          old_eof = 'access.write_text(source.rstrip() + append + "\\n", encoding="utf-8")'
          new_eof = 'access.write_text(source.rstrip() + append.rstrip() + "\\n", encoding="utf-8")'
          if old_eof in text:
              text = text.replace(old_eof, new_eof, 1)

          if new_brace not in text:
              raise SystemExit('renderPlatform brace fix is not present')
          if new_eof not in text:
              raise SystemExit('access.py EOF normalization fix is not present')

          path.write_text(text, encoding='utf-8')
          print('transformer normalized')
          PY
      - name: Commit fix when needed
        run: |
          if git diff --quiet; then
            echo "No transformer update required"
            exit 0
          fi
          git config user.name "PlaceAI Hardening Bot"
          git config user.email "placeai-hardening@users.noreply.github.com"
          git add scripts/batch40_email_observability.py
          git commit -m "Normalize batch 40 generated file endings"
          git push origin HEAD:fix/password-reset-observability-batch40
