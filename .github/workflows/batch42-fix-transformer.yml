name: PlaceAI batch 42 transformer fix

on:
  push:
    branches:
      - fix/api-error-contract-batch42

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/api-error-contract-batch42
      - name: Repair transformer anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/batch42_api_error_contract.py')
          text = path.read_text(encoding='utf-8')

          core_anchor = '# Core workspace API wrapper: one normalized error type instead of raw Pydantic joins/statuses.\n'
          start = text.index(core_anchor) + len(core_anchor)
          first = text.index('replace_once(', start)
          second = text.index('replace_once(', first + len('replace_once('))
          core_block = '''replace_once(
    "app/static/app.js",
    "  const fmtDate = v =>",
    "  const apiErrors = window.PlaceAIApiErrors;\\n  const fmtDate = v =>",
)
'''
          text = text[:first] + core_block + text[second:]

          mock_comment = '# Mock interview uses the same API contract and field-level form feedback.\n'
          mstart = text.index(mock_comment) + len(mock_comment)
          mock_read = text.index('mock = mock_path.read_text', mstart)
          first_replace = text.index('mock = mock.replace(', mock_read)
          second_replace = text.index('mock = mock.replace(', first_replace + len('mock = mock.replace('))
          mock_block = '''if "const apiErrors = window.PlaceAIApiErrors;" not in mock:
    marker = "  const state = { token:'', jobs:[], session:null };"
    if marker not in mock:
        raise SystemExit("mock interview state anchor not found")
    mock = mock.replace(marker, "  const apiErrors = window.PlaceAIApiErrors;\\n" + marker, 1)
'''
          text = text[:first_replace] + mock_block + text[second_replace:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit transformer repair
        run: |
          if git diff --quiet -- scripts/batch42_api_error_contract.py; then
            echo "Transformer already repaired"
            exit 0
          fi
          git config user.name "PlaceAI Hardening Bot"
          git config user.email "placeai-hardening@users.noreply.github.com"
          git add scripts/batch42_api_error_contract.py
          git commit -m "Repair batch 42 transformer anchors"
          git push origin HEAD:fix/api-error-contract-batch42
