name: PlaceAI student signup validation normalization

on:
  push:
    branches:
      - fix/student-signup-validation-batch38

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/student-signup-validation-batch38
          fetch-depth: 0
      - name: Apply signup validation hardening
        run: python scripts/batch38_signup_validation.py
      - name: Verify generated changes
        run: |
          node --check app/static/access-portal.js
          python -m py_compile tests/test_signup_validation_ui.py
          git diff --check
      - name: Commit signup validation hardening
        run: |
          git config user.name "PlaceAI Hardening Bot"
          git config user.email "placeai-hardening@users.noreply.github.com"
          git add app/static/access-portal.js tests/test_signup_validation_ui.py MANIFEST.sha256
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix student signup validation feedback"
          git push origin HEAD:fix/student-signup-validation-batch38
