name: Verify Live AI Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-openai.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Vercel AI readiness contract
        shell: bash
        run: |
          set -euo pipefail
          status_body="$(curl -fsS --retry 5 --retry-delay 2 --connect-timeout 15 --max-time 30 'https://placeai-rxpp.vercel.app/ai/status')"
          STATUS_BODY="$status_body" python - <<'PY'
          import json, os
          status = json.loads(os.environ['STATUS_BODY'])
          configured = status.get('configured') is True
          sdk_available = status.get('sdk_available') is True
          print(f'Vercel AI status: configured={configured} sdk_available={sdk_available}')
          if not configured or not sdk_available:
              raise SystemExit('LIVE_PROVIDER_UNAVAILABLE: AI provider is not ready.')
          if set(status) != {'configured', 'sdk_available'}:
              raise SystemExit(f'PUBLIC_AI_STATUS_METADATA_LEAK: {sorted(status)}')
          print('VERCEL_AI_READINESS_OK')
          PY

      - name: Verify Render gateway AI readiness contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --retry 5 --retry-delay 2 --connect-timeout 15 --max-time 30 'https://placeai-recovery.onrender.com/ai/status')"
          BODY="$body" python - <<'PY'
          import json, os
          payload = json.loads(os.environ['BODY'])
          configured = payload.get('configured') is True
          sdk_available = payload.get('sdk_available') is True
          print(f'Render gateway AI status: configured={configured} sdk_available={sdk_available}')
          if not configured or not sdk_available:
              raise SystemExit('RENDER_GATEWAY_AI_UNAVAILABLE')
          if set(payload) != {'configured', 'sdk_available'}:
              raise SystemExit(f'RENDER_AI_STATUS_METADATA_LEAK: {sorted(payload)}')
          print('RENDER_AI_READINESS_OK')
          PY
