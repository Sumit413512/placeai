name: PlaceAI provisioned password rotation normalization

on:
  push:
    branches:
      - fix/provisioned-password-rotation-batch39

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provisioned-password-rotation-batch39
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply password rotation hardening
        run: python scripts/batch39_password_rotation.py
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify generated changes
        run: |
          node --check app/static/account-security.js
          python -m compileall -q app tests alembic
          ruff check app tests alembic --select E9,F63,F7,F82
          pytest -q tests/test_first_login_password_rotation.py
          sha256sum -c MANIFEST.sha256
          git diff --check
      - name: Commit password rotation hardening
        run: |
          git config user.name "PlaceAI Hardening Bot"
          git config user.email "placeai-hardening@users.noreply.github.com"
          git add app alembic tests MANIFEST.sha256
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Enforce first-login password rotation"
          git push origin HEAD:fix/provisioned-password-rotation-batch39
