name: Manifest Repair Check

on:
  push:
    branches: [fix/reset-probe-20260911]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calculate changed hashes
        run: |
          sha256sum alembic/env.py app/database.py tests/test_database_readiness.py app/static/ui-state-fixes.js
          node --check app/static/ui-state-fixes.js
