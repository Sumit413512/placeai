name: Bootstrap manifest sync

on:
  push:
    branches:
      - hotfix/vercel-bootstrap-diagnostics

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/vercel-bootstrap-diagnostics
          fetch-depth: 0
      - name: Synchronize release manifest
        run: |
          rm -f .github/workflows/bootstrap-manifest-sync.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          excluded = {"MANIFEST.sha256", ".github/workflows/bootstrap-manifest-sync.yml"}
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          lines = []
          for filename in sorted(files):
              if filename in excluded:
                  continue
              path = Path(filename)
              if path.is_file():
                  lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {filename}")
          Path("MANIFEST.sha256").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Commit synchronized manifest and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resynchronize Vercel bootstrap manifest"
          git push origin HEAD:hotfix/vercel-bootstrap-diagnostics
