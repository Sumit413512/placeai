name: Database diagnostic manifest sync

on:
  push:
    branches:
      - hotfix/database-readiness-diagnostics

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/database-readiness-diagnostics
          fetch-depth: 0
      - name: Synchronize manifest
        run: |
          rm -f .github/workflows/database-diagnostic-manifest-sync.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          excluded = {"MANIFEST.sha256", ".github/workflows/database-diagnostic-manifest-sync.yml"}
          lines=[]
          for filename in sorted(subprocess.check_output(["git","ls-files"], text=True).splitlines()):
              if filename in excluded:
                  continue
              path=Path(filename)
              if path.is_file():
                  lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {filename}")
          Path("MANIFEST.sha256").write_text("\n".join(lines)+"\n", encoding="utf-8")
          PY
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize database readiness manifest"
          git push origin HEAD:hotfix/database-readiness-diagnostics
