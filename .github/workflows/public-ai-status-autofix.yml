name: Public AI Status Autofix

on:
  push:
    branches:
      - hardening/public-ai-status-20261007

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[public-ai-status-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove public provider model metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/routers/ai.py')
          text = path.read_text(encoding='utf-8')
          old = '''@router.get("/status", summary="AI provider configuration status")
def ai_status():
    """Return privacy-safe AI readiness without exposing API keys."""
    return ai_status_payload()
'''
          new = '''@router.get("/status", summary="AI provider configuration status")
def ai_status():
    """Return coarse public readiness without exposing provider or model details."""
    payload = ai_status_payload()
    return {
        "configured": bool(payload.get("configured")),
        "sdk_available": bool(payload.get("sdk_available")),
    }
'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one public AI status function, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit exact patch
        run: |
          git config user.name "placeai-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/routers/ai.py
          git diff --cached --check
          git commit -m "Harden public AI status metadata [public-ai-status-patched]"
          git push origin HEAD:${GITHUB_REF_NAME}
