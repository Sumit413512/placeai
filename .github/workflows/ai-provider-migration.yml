name: One-time OpenAI Primary Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-provider-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch AI router to provider abstraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/routers/ai.py')
          text = path.read_text(encoding='utf-8')

          anchor = 'from app.storage import read_file_bytes\n'
          provider_import = 'from app.ai_provider import ai_status_payload, call_ai_text, current_ai_model, current_ai_provider\n'
          if provider_import not in text:
              if anchor not in text:
                  raise SystemExit('AI router import anchor not found')
              text = text.replace(anchor, anchor + provider_import, 1)

          old_marker = '@router.get("/status", summary="Gemini configuration status")'
          if old_marker in text:
              start = text.index(old_marker)
              end = text.index('\ndef extract_json_from_response', start)
              replacement = (
                  '@router.get("/status", summary="AI provider configuration status")\n'
                  'def ai_status():\n'
                  '    """Return privacy-safe AI readiness without exposing API keys."""\n'
                  '    return ai_status_payload()\n\n\n'
                  'def get_gemini_client():\n'
                  '    """Compatibility shim retained for existing call sites during provider migration."""\n'
                  '    return None\n\n\n'
                  'def call_gemini(_client, prompt: str) -> str:\n'
                  '    """Route OpenAI primary -> OpenAI backup -> Gemini fallback."""\n'
                  '    return call_ai_text(prompt)\n\n'
              )
              text = text[:start] + replacement + text[end + 1:]

          text = text.replace('AI-powered features using Google Gemini.', 'AI-powered features using OpenAI with Gemini fallback.')
          text = text.replace('using Gemini AI.', 'using the configured AI provider.')
          text = text.replace('plus Gemini.', 'through the configured AI provider.')
          text = text.replace('from a Gemini response', 'from an AI provider response')
          text = text.replace(
              '"model": settings.gemini_model, "guardrail"',
              '"model": current_ai_model(), "provider": current_ai_provider(), "guardrail"',
          )

          if 'call_ai_text(prompt)' not in text or provider_import not in text:
              raise SystemExit('AI provider migration verification failed')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit AI router migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PlaceAI Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/routers/ai.py
          if git diff --cached --quiet; then
            echo 'AI router already migrated.'
            exit 0
          fi
          git commit -m 'feat: route PlaceAI AI through OpenAI with Gemini fallback'
          git push origin HEAD:main
