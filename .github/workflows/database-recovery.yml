name: PlaceAI database recovery
on:
  pull_request:
    paths:
      - 'scripts/*drill.sh'
      - 'scripts/backup-public-db.sh'
      - '.github/workflows/database-recovery.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'

permissions:
  contents: read

jobs:
  recovery-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install drill tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y age rclone postgresql-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Check backup round trip with synthetic tenants
        run: bash scripts/test-recovery-drill.sh

  export:
    needs: recovery-drill
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && vars.PLACEAI_BACKUP_ENABLED == 'true'
    environment: database-backup
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install backup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y age rclone postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Export and verify the encrypted backup
        env:
          PGDATABASE: postgres
          PGHOST: ${{ vars.BACKUP_PGHOST }}
          PGPORT: ${{ vars.BACKUP_PGPORT }}
          PGUSER: ${{ vars.BACKUP_PGUSER }}
          PGSSLMODE: verify-full
          PGPASSWORD: ${{ secrets.BACKUP_PGPASSWORD }}
          DATABASE_CA: ${{ secrets.BACKUP_DATABASE_CA }}
          REMOTE_CONFIG: ${{ secrets.BACKUP_RCLONE_CONFIG }}
          BACKUP_RECIPIENT: ${{ vars.BACKUP_RECIPIENT }}
          BACKUP_REMOTE: ${{ vars.BACKUP_REMOTE }}
        run: |
          set -eu
          umask 077
          : "${PGHOST:?}" "${PGUSER:?}" "${PGPORT:?}" "${PGPASSWORD:?}" "${DATABASE_CA:?}" "${REMOTE_CONFIG:?}"
          stage=$(mktemp -d)
          trap 'rm -rf -- "$stage"' EXIT
          export PGSSLROOTCERT="$stage/db.crt" RCLONE_CONFIG="$stage/rclone.conf"
          printf '%s\n' "$DATABASE_CA" > "$PGSSLROOTCERT"
          printf '%s\n' "$REMOTE_CONFIG" > "$RCLONE_CONFIG"
          bash scripts/backup-public-db.sh
