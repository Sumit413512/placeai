name: PlaceAI notification navigation normalization

on:
  push:
    branches:
      - fix/notification-navigation-batch34

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notification-navigation-batch34

      - name: Normalize notification navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('app/static/app.js')
          text = path.read_text(encoding='utf-8')

          anchor = "  async function renderNotifications() {\n"
          helper = """  function notificationTarget(link) {\n    const candidate = String(link || '').trim().split(':', 1)[0];\n    return (state.nav || []).some(item => item[1] === candidate) ? candidate : 'notifications';\n  }\n\n"""
          if helper not in text:
              if anchor not in text:
                  raise SystemExit('renderNotifications anchor missing')
              text = text.replace(anchor, helper + anchor, 1)

          old_nav = "      if (view === 'notifications') { renderNotifications(); return; }\n"
          new_nav = "      if (view === 'notifications') { await renderNotifications(); return; }\n"
          if old_nav in text:
              text = text.replace(old_nav, new_nav, 1)
          elif new_nav not in text:
              raise SystemExit('notification navigation anchor missing')

          old_open = "      else if(a==='open-notification'){await api(`/enterprise/notifications/${id}/read`,{method:'PATCH'});await updateNotificationBadge();navigate(val||'dashboard');}\n"
          new_open = "      else if(a==='open-notification'){await api(`/enterprise/notifications/${id}/read`,{method:'PATCH'});await updateNotificationBadge();await navigate(notificationTarget(val));}\n"
          if old_open in text:
              text = text.replace(old_open, new_open, 1)
          elif new_open not in text:
              raise SystemExit('open-notification handler anchor missing')

          path.write_text(text, encoding='utf-8')

          manifest = Path('MANIFEST.sha256')
          rows = []
          seen = set()
          for raw in manifest.read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              _digest, file_name = raw.split(maxsplit=1)
              file_name = file_name.strip()
              file_path = Path(file_name)
              if not file_path.is_file():
                  raise SystemExit(f'Manifest path missing: {file_name}')
              rows.append((file_name, hashlib.sha256(file_path.read_bytes()).hexdigest()))
              seen.add(file_name)
          extra = 'tests/test_notification_navigation.py'
          if extra not in seen:
              rows.append((extra, hashlib.sha256(Path(extra).read_bytes()).hexdigest()))
          manifest.write_text(''.join(f'{digest}  {file_name}\n' for file_name, digest in rows), encoding='utf-8')
          PY

          rm -f .github/workflows/batch34-notification-navigation.yml

      - name: Commit normalized notification navigation
        shell: bash
        run: |
          git config user.name "PlaceAI Hardening Bot"
          git config user.email "placeai-hardening@users.noreply.github.com"
          git add app/static/app.js tests/test_notification_navigation.py MANIFEST.sha256 .github/workflows/batch34-notification-navigation.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Harden notification navigation"
          git push origin HEAD:fix/notification-navigation-batch34
