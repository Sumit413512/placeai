name: PlaceAI frontend permission consistency normalization

on:
  push:
    branches:
      - fix/frontend-permission-consistency-batch33

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-permission-consistency-batch33

      - name: Apply frontend consistency patch
        run: python scripts/batch33_patch.py

      - name: Commit normalized frontend
        shell: bash
        run: |
          rm -f scripts/batch33_patch.py .github/workflows/batch33-frontend-normalize.yml
          git config user.name "PlaceAI Hardening Bot"
          git config user.email "placeai-hardening@users.noreply.github.com"
          git add app/static/app.js tests/test_frontend_permission_consistency.py MANIFEST.sha256 scripts/batch33_patch.py .github/workflows/batch33-frontend-normalize.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Align frontend with production permissions"
          git push origin HEAD:fix/frontend-permission-consistency-batch33
