name: Canonical Enterprise Consolidation

on:
  push:
    branches: [release/production-grade-20260912]
    paths: [.github/workflows/canonical-enterprise-consolidation.yml]

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/production-grade-20260912

      - name: Consolidate enterprise route ownership
        run: python scripts/canonicalize_enterprise_routes.py

      - name: Remove one-shot release tooling
        run: |
          rm scripts/canonicalize_enterprise_routes.py
          rm .github/workflows/canonical-enterprise-consolidation.yml

      - name: Refresh release manifest and commit
        run: |
          git config user.name "placeai-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git ls-files -z | grep -zv '^MANIFEST.sha256$' | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          git add MANIFEST.sha256
          git commit -m "refactor: canonicalize enterprise production routes"
          git push origin HEAD:release/production-grade-20260912
