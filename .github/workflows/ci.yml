name: PlaceAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install browser smoke runtime
        run: python -m playwright install --with-deps chromium

      - name: Generate release integrity evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/placeai-integrity
          git ls-files -z | sort -z | xargs -0 sha256sum > /tmp/placeai-integrity/MANIFEST.sha256
          sha256sum -c /tmp/placeai-integrity/MANIFEST.sha256
          sha256sum /tmp/placeai-integrity/MANIFEST.sha256 > /tmp/placeai-integrity/MANIFEST.sha256.digest

      - name: Upload release integrity evidence
        uses: actions/upload-artifact@v4
        with:
          name: placeai-integrity-${{ github.sha }}
          path: /tmp/placeai-integrity/
          retention-days: 30
          if-no-files-found: error

      - name: Compile Python
        run: python -m compileall -q app scripts tests alembic

      - name: Check frontend JavaScript
        run: |
          node --check app/static/app.js
          node --check app/static/access-portal.js
          node --check app/static/api-errors.js
          node --check app/static/account-security.js
          node --check app/static/mock-interview.js
          node --check app/static/ui-state-fixes.js
          node --check app/static/integration-readiness.js

      - name: Critical Python static analysis
        run: ruff check app scripts tests alembic --select E9,F63,F7,F82

      - name: Run tests
        run: pytest -q

      - name: Clean test artifacts
        run: |
          rm -rf .pytest_cache .coverage placeai.db
          rm -rf uploads/student-documents uploads/communication-attachments uploads/offer-letters
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Release hygiene
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/placeai-release-check
          mkdir -p /tmp/placeai-release-check
          git archive HEAD | tar -x -C /tmp/placeai-release-check
          (cd /tmp/placeai-release-check && python scripts/release_check.py)
          git diff --check
