name: PlaceAI Manifest Repair Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manifest-repair-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild complete release manifest and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/manifest-repair-once.yml
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import subprocess

          root = Path('.')
          files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          files = [p for p in files if p != 'MANIFEST.sha256' and p != '.github/workflows/manifest-repair-once.yml']
          lines = []
          for rel in sorted(files):
              path = root / rel
              if path.is_file():
                  lines.append(f"{sha256(path.read_bytes()).hexdigest()}  {rel}")
          Path('MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          sha256sum -c MANIFEST.sha256
          git add MANIFEST.sha256
          git commit -m 'Synchronize PlaceAI release manifest'
          git push origin HEAD:main
