name: Audit reconstructed PlaceAI source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconstruct-placeai.yml'
      - 'bundle/**'
      - 'bundle4/**'
      - 'bundle8/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-placeai-source
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PlaceAI repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct validated source bundles without publishing
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          extract_bundle() {
            local dir="$1"
            local parts=("$dir"/part*.txt)
            if [ ${#parts[@]} -eq 0 ]; then
              echo "No parts found for $dir; skipping."
              return 0
            fi

            local work="/tmp/placeai-${dir}"
            rm -rf "$work"
            mkdir -p "$work/extracted"
            : > "$work/archive.xz"

            # Each part was uploaded as an independently base64-encoded binary fragment.
            # Normalize whitespace and decode each fragment before concatenating bytes.
            for part in "${parts[@]}"; do
              tr -cd 'A-Za-z0-9+/=' < "$part" | base64 --decode >> "$work/archive.xz"
            done

            if tar -tJf "$work/archive.xz" >/dev/null 2>&1; then
              tar -xJf "$work/archive.xz" -C "$work/extracted"
            else
              xz -dc "$work/archive.xz" > "$work/payload"
              if unzip -t "$work/payload" >/dev/null 2>&1; then
                unzip -q "$work/payload" -d "$work/extracted"
              else
                echo "Unsupported reconstructed payload in $dir" >&2
                file "$work/archive.xz" "$work/payload" || true
                exit 1
              fi
            fi

            local src="$work/extracted"
            mapfile -t top_entries < <(find "$src" -mindepth 1 -maxdepth 1 -printf '%P\n')
            if [ ${#top_entries[@]} -eq 1 ] && [ -d "$src/${top_entries[0]}" ]; then
              src="$src/${top_entries[0]}"
            fi
            rsync -a --exclude='.git/' --exclude='.github/' "$src/" ./
          }

          extract_bundle bundle
          extract_bundle bundle4
          extract_bundle bundle8

          rm -rf bundle bundle4 bundle8
          rm -rf .pytest_cache placeai.db
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

          test -f app/app.py
          test -f requirements.txt
          test -f vercel.json

          echo '--- reconstructed source inventory ---'
          find app alembic scripts tests -type f 2>/dev/null | sort
          echo '--- release identifiers ---'
          cat VERSION 2>/dev/null || true
          sha256sum requirements.txt vercel.json app/app.py app/models.py app/routers/auth.py 2>/dev/null || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install app and audit tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff bandit pip-audit

      - name: Compile and test
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app scripts tests
          pytest -q

      - name: Ruff static analysis
        continue-on-error: true
        run: ruff check app scripts tests

      - name: Bandit security analysis
        continue-on-error: true
        run: bandit -r app scripts -x tests -f screen

      - name: Dependency vulnerability audit
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: Release verification
        shell: bash
        run: |
          rm -rf .pytest_cache placeai.db
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -rf uploads/student-documents uploads/communication-attachments uploads/offer-letters
          python scripts/release_check.py

      - name: Confirm no secrets are tracked
        shell: bash
        run: |
          set -euo pipefail
          if find . -maxdepth 2 -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name 'placeai.db' \) -print | grep -q .; then
            echo 'Sensitive/runtime file detected in reconstructed tree' >&2
            exit 1
          fi
