name: Port Institution Report Scope Fix

on:
  push:
    branches: [fix/institution-report-scope-v2]

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/institution-report-scope-v2
          fetch-depth: 0
      - name: Port validated report scoping files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/institution-report-scope
          git show origin/fix/institution-report-scope:app/routers/report_export_safe.py > app/routers/report_export_safe.py
          git show origin/fix/institution-report-scope:tests/test_report_export_security.py > tests/test_report_export_security.py

          report_hash=$(sha256sum app/routers/report_export_safe.py | awk '{print $1}')
          test_hash=$(sha256sum tests/test_report_export_security.py | awk '{print $1}')
          python - "$report_hash" "$test_hash" <<'PY'
          from pathlib import Path
          import sys
          report_hash, test_hash = sys.argv[1:]
          p = Path('MANIFEST.sha256')
          lines = p.read_text(encoding='utf-8').splitlines()
          out = []
          found_report = found_test = False
          for line in lines:
              if line.endswith('  app/routers/report_export_safe.py'):
                  out.append(f'{report_hash}  app/routers/report_export_safe.py')
                  found_report = True
              elif line.endswith('  tests/test_report_export_security.py'):
                  out.append(f'{test_hash}  tests/test_report_export_security.py')
                  found_test = True
              else:
                  out.append(line)
          if not (found_report and found_test):
              raise SystemExit('Required manifest entries not found')
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

          git diff --check
          if git diff --quiet; then
            echo 'Report scoping fix already ported.'
            exit 0
          fi
          git config user.name 'PlaceAI Production Repair'
          git config user.email 'skj1200519@gmail.com'
          git add app/routers/report_export_safe.py tests/test_report_export_security.py MANIFEST.sha256
          git commit -m 'Scope institution participation reports to real activity'
          git push origin HEAD:fix/institution-report-scope-v2
