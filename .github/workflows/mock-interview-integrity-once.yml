name: PlaceAI Mock Interview Integrity Once

on:
  push:
    branches: [hardening/mock-interview-session-integrity]
    paths:
      - '.github/workflows/mock-interview-integrity-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove stale filesystem side effect, harden contracts, add regression coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path

          students = Path('app/routers/students.py')
          text = students.read_text(encoding='utf-8')
          old = 'settings = get_settings()\nsettings.upload_dir.mkdir(parents=True, exist_ok=True)\nrouter = APIRouter(prefix="/students", tags=["Students"])'
          new = 'settings = get_settings()\nrouter = APIRouter(prefix="/students", tags=["Students"])'
          if old not in text:
              raise SystemExit('Stale student upload mkdir insertion point not found')
          text = text.replace(old, new, 1)
          old = '    interviews = len(profile.mock_interviews)\n    avg_interview = None\n    scores = [i.overall_score for i in profile.mock_interviews if i.overall_score is not None]'
          new = '    scores = [i.overall_score for i in profile.mock_interviews if i.overall_score is not None]\n    interviews = len(scores)\n    avg_interview = None'
          if old not in text:
              raise SystemExit('Student interview metric insertion point not found')
          text = text.replace(old, new, 1)
          students.write_text(text, encoding='utf-8')

          router = Path('app/routers/mock_interview.py')
          text = router.read_text(encoding='utf-8')
          replacements = {
              'class MockInterviewStart(BaseModel):\n    job_id: str\n    focus: str = Field(default="balanced", pattern="^(balanced|technical|behavioral|hr)$")\n    question_count: int = Field(default=5, ge=3, le=8)':
              'class MockInterviewStart(BaseModel):\n    model_config = {"extra": "forbid"}\n\n    job_id: str\n    focus: str = Field(default="balanced", pattern="^(balanced|technical|behavioral|hr)$")\n    question_count: int = Field(default=5, ge=3, le=8)',
              'class MockInterviewAnswer(BaseModel):\n    question_id: int\n    answer: str = Field(min_length=1, max_length=8000)':
              'class MockInterviewAnswer(BaseModel):\n    model_config = {"extra": "forbid"}\n\n    question_id: int\n    answer: str = Field(min_length=1, max_length=8000)',
              'class MockInterviewEvaluation(BaseModel):\n    interview_id: str\n    answers: list[MockInterviewAnswer] = Field(min_length=1, max_length=8)':
              'class MockInterviewEvaluation(BaseModel):\n    model_config = {"extra": "forbid"}\n\n    interview_id: str\n    answers: list[MockInterviewAnswer] = Field(min_length=1, max_length=8)',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Mock interview contract insertion point not found: {old.splitlines()[0]}')
              text = text.replace(old, new, 1)
          router.write_text(text, encoding='utf-8')

          tests = Path('tests/test_core_flows.py')
          text = tests.read_text(encoding='utf-8')
          marker = 'def test_mock_interview_server_issued_session_integrity(monkeypatch):'
          if marker not in text:
              text += '''\n\n\ndef test_mock_interview_server_issued_session_integrity(monkeypatch):\n    import json\n    import app.routers.mock_interview as mock_router\n    from app.models import Job, MockInterview, StudentProfile\n\n    student = login("student@northstar.example.com", "StudentPass123!")\n    db = SessionLocal()\n    try:\n        job = db.query(Job).filter(Job.title == "Graduate Software Engineer").first()\n        assert job is not None\n        job_id = job.id\n        student_user = db.query(User).filter(User.email == "student@northstar.example.com").first()\n        profile = db.query(StudentProfile).filter(StudentProfile.user_id == student_user.id).first()\n        scored_before = db.query(MockInterview).filter(MockInterview.student_id == profile.id, MockInterview.overall_score.isnot(None)).count()\n    finally:\n        db.close()\n\n    def fake_ai(_client, prompt):\n        if "Generate exactly" in prompt:\n            return json.dumps({"questions": [\n                {"question_id": 1, "question": "Explain a production API decision you made.", "category": "technical"},\n                {"question_id": 2, "question": "How would you debug a failing service?", "category": "situational"},\n                {"question_id": 3, "question": "Describe a disagreement you resolved.", "category": "behavioral"},\n            ]})\n        return json.dumps({\n            "overall_score": 82,\n            "overall_feedback": "Strong structured practice response.",\n            "dimensions": {\n                "relevance": 84, "clarity": 82, "structure": 80, "language_precision": 81,\n                "role_knowledge": 85, "problem_solving": 83, "professionalism": 79\n            },\n            "strengths": ["Relevant reasoning"],\n            "improvements": ["Add measurable outcomes"],\n            "evaluations": [\n                {"question_id": 1, "score": 83, "feedback": "Good", "better_answer_outline": "Context → decision → result"},\n                {"question_id": 2, "score": 82, "feedback": "Good", "better_answer_outline": "Triage → isolate → verify"},\n                {"question_id": 3, "score": 81, "feedback": "Good", "better_answer_outline": "Situation → action → result"},\n            ],\n        })\n\n    monkeypatch.setattr(mock_router, "call_gemini", fake_ai)\n\n    started = client.post("/mock-interview/start", headers=auth(student), json={\n        "job_id": job_id, "focus": "balanced", "question_count": 3\n    })\n    assert started.status_code == 200, started.text\n    payload = started.json()\n    assert payload["interview_id"]\n    assert len(payload["questions"]) == 3\n\n    dashboard = client.get("/students/dashboard", headers=auth(student))\n    assert dashboard.status_code == 200\n    assert dashboard.json()["interviews_completed"] == scored_before\n\n    incomplete = client.post("/mock-interview/evaluate", headers=auth(student), json={\n        "interview_id": payload["interview_id"],\n        "answers": [{"question_id": 1, "answer": "Only one answer"}],\n    })\n    assert incomplete.status_code == 422\n\n    injected = client.post("/mock-interview/evaluate", headers=auth(student), json={\n        "interview_id": payload["interview_id"],\n        "job_id": job_id,\n        "answers": [\n            {"question_id": q["question_id"], "question": "Replace with an easier question", "answer": "Answer"}\n            for q in payload["questions"]\n        ],\n    })\n    assert injected.status_code == 422\n\n    answers = [\n        {"question_id": q["question_id"], "answer": f"Structured answer for question {q['question_id']}"}\n        for q in payload["questions"]\n    ]\n    evaluated = client.post("/mock-interview/evaluate", headers=auth(student), json={\n        "interview_id": payload["interview_id"], "answers": answers\n    })\n    assert evaluated.status_code == 200, evaluated.text\n    assert evaluated.json()["overall_score"] == 82\n\n    repeated = client.post("/mock-interview/evaluate", headers=auth(student), json={\n        "interview_id": payload["interview_id"], "answers": answers\n    })\n    assert repeated.status_code == 409\n\n    history = client.get("/mock-interview/history", headers=auth(student))\n    assert history.status_code == 200\n    assert any(row["id"] == payload["interview_id"] and row["overall_score"] == 82 for row in history.json())\n\n    dashboard = client.get("/students/dashboard", headers=auth(student))\n    assert dashboard.status_code == 200\n    assert dashboard.json()["interviews_completed"] == scored_before + 1\n'''
              tests.write_text(text, encoding='utf-8')
          PY

          python -m compileall -q app tests
          node --check app/static/mock-interview.js
          grep -q 'interviews = len(scores)' app/routers/students.py
          if grep -q 'settings.upload_dir.mkdir' app/routers/students.py; then
            echo '::error::students.py still contains an import-time upload mkdir'
            exit 1
          fi

          git rm .github/workflows/mock-interview-integrity-once.yml
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import subprocess

          files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          files = [p for p in files if p not in {'MANIFEST.sha256', '.github/workflows/mock-interview-integrity-once.yml'}]
          lines = []
          for rel in sorted(files):
              path = Path(rel)
              if path.is_file():
                  lines.append(f"{sha256(path.read_bytes()).hexdigest()}  {rel}")
          Path('MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          sha256sum -c MANIFEST.sha256
          git add app/routers/students.py app/routers/mock_interview.py tests/test_core_flows.py MANIFEST.sha256
          git commit -m 'Harden mock interview session integrity'
          git push origin HEAD:hardening/mock-interview-session-integrity
