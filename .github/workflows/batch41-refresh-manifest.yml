name: PlaceAI batch 41 manifest refresh

on:
  push:
    branches:
      - fix/provisioning-credential-handoff-batch41

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provisioning-credential-handoff-batch41
      - name: Refresh changed-file manifest entries
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          manifest = Path('MANIFEST.sha256')
          lines = manifest.read_text(encoding='utf-8').splitlines()
          targets = [
              'app/static/account-security.js',
              'tests/test_provisioning_credential_handoff.py',
          ]
          mapping = {}
          for path in targets:
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              mapping[path] = f'{digest}  {path}'

          output = []
          seen = set()
          for line in lines:
              path = line.split('  ', 1)[1] if '  ' in line else ''
              if path in mapping:
                  output.append(mapping[path])
                  seen.add(path)
              else:
                  output.append(line)
          for path in targets:
              if path not in seen:
                  output.append(mapping[path])
          output.sort(key=lambda line: line.split('  ', 1)[1] if '  ' in line else line)
          manifest.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
      - name: Commit manifest refresh
        run: |
          if git diff --quiet -- MANIFEST.sha256; then
            echo "Manifest already current"
            exit 0
          fi
          git config user.name "PlaceAI Hardening Bot"
          git config user.email "placeai-hardening@users.noreply.github.com"
          git add MANIFEST.sha256
          git commit -m "Refresh batch 41 release manifest"
          git push origin HEAD:fix/provisioning-credential-handoff-batch41
