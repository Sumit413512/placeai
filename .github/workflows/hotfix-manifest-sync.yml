name: Hotfix manifest sync

on:
  push:
    branches:
      - hotfix/vercel-runtime-startup

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/vercel-runtime-startup
      - name: Recompute tracked release hashes and remove this workflow
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          from pathlib import Path

          manifest_path = Path('MANIFEST.sha256')
          output = []
          for raw_line in manifest_path.read_text(encoding='utf-8').splitlines():
              if not raw_line.strip():
                  continue
              _, path = raw_line.split('  ', 1)
              target = Path(path)
              if not target.exists():
                  raise SystemExit(f'Manifest path is missing: {path}')
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              output.append(f'{digest}  {path}')
          manifest_path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/hotfix-manifest-sync.yml
      - name: Commit synchronized manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Synchronize Vercel runtime hotfix manifest"
          git push origin HEAD:hotfix/vercel-runtime-startup
