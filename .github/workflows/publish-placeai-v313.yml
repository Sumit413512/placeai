name: Publish verified PlaceAI 3.1.3 source

on:
  push:
    branches: [main]
    paths:
      - 'placeai_v313_release.part15.b64'
      - '.github/workflows/publish-placeai-v313.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: placeai-v313-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair and verify transport integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('placeai_v313_release.part00.b64')
          expected = 'e24de49d893fa2e5e041eaf021d7fbd4087ef368'
          data = path.read_bytes()

          def git_blob_sha(payload: bytes) -> str:
              header = f'blob {len(payload)}\0'.encode()
              return hashlib.sha1(header + payload).hexdigest()

          current = git_blob_sha(data)
          if current != expected:
              if len(data) != 11767:
                  raise SystemExit(f'Unexpected part00 length: {len(data)}')
              alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
              repaired = None
              for pos in range(len(data) + 1):
                  left, right = data[:pos], data[pos:]
                  for char in alphabet:
                      candidate = left + bytes((char,)) + right
                      if git_blob_sha(candidate) == expected:
                          repaired = candidate
                          print(f'Recovered missing Base64 byte at offset {pos}: {chr(char)!r}')
                          break
                  if repaired is not None:
                      break
              if repaired is None:
                  raise SystemExit('Unable to repair part00 to its expected Git blob SHA')
              path.write_bytes(repaired)
              data = repaired

          if git_blob_sha(data) != expected:
              raise SystemExit('part00 integrity verification failed after repair')
          print('part00 Git blob SHA verified:', expected)
          PY

          parts=(placeai_v313_release.part*.b64)
          test ${#parts[@]} -eq 16

      - name: Verify and extract release
        shell: bash
        run: |
          set -euo pipefail
          parts=(placeai_v313_release.part*.b64)
          cat "${parts[@]}" | base64 --decode > /tmp/placeai-v313.tar.xz
          echo 'ba9d5fcf259f4b25c3236ca81fc2dd6a8720455cc8221bd683b40baae1e93755  /tmp/placeai-v313.tar.xz' | sha256sum -c -
          xz -t /tmp/placeai-v313.tar.xz
          rm -rf /tmp/placeai-v313
          mkdir -p /tmp/placeai-v313
          tar -xJf /tmp/placeai-v313.tar.xz -C /tmp/placeai-v313
          test -f /tmp/placeai-v313/app/app.py
          test -f /tmp/placeai-v313/vercel.json
          test "$(cat /tmp/placeai-v313/VERSION)" = '3.1.3'
          (cd /tmp/placeai-v313 && sha256sum -c MANIFEST.sha256)

      - name: Replace transport bundles with real source tree
        shell: bash
        run: |
          set -euo pipefail
          # Preserve .github here. GitHub's Actions token cannot create or update
          # workflow files without the special workflows permission. The canonical
          # CI workflow is installed separately after this verified source commit.
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/placeai-v313/ ./

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python and validate frontend JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app scripts tests alembic
          node --check app/static/app.js

      - name: Critical Python static analysis
        shell: bash
        run: |
          set -euo pipefail
          ruff check app scripts tests alembic --select E9,F63,F7,F82

      - name: Run PlaceAI automated tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q

      - name: Clean test artifacts and verify release hygiene
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pytest_cache .coverage placeai.db
          rm -rf uploads/student-documents uploads/communication-attachments uploads/offer-letters
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          (cd /tmp/placeai-v313 && python scripts/release_check.py)
          git diff --check

      - name: Commit canonical PlaceAI source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish verified PlaceAI 3.1.3 source tree'
          git push origin HEAD:main
