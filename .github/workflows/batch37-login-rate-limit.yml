name: PlaceAI login rate-limit normalization

on:
  push:
    branches:
      - fix/login-rate-limit-integrity-batch37

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/login-rate-limit-integrity-batch37

      - name: Unify role-login throttling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('app/routers/access.py')
          text = path.read_text(encoding='utf-8')
          old = '''        scope="login-role",\n        identifier=f"{body.role}:{email}",\n'''
          new = '''        scope="login",\n        identifier=email,\n'''
          if old not in text:
              raise SystemExit('role login rate-limit anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          manifest = Path('MANIFEST.sha256')
          rows = []
          seen = set()
          for raw in manifest.read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              _digest, file_name = raw.split(maxsplit=1)
              file_name = file_name.strip()
              file_path = Path(file_name)
              if not file_path.is_file():
                  raise SystemExit(f'Manifest path missing: {file_name}')
              rows.append((file_name, hashlib.sha256(file_path.read_bytes()).hexdigest()))
              seen.add(file_name)
          extra = 'tests/test_login_rate_limit_integrity.py'
          if extra not in seen:
              rows.append((extra, hashlib.sha256(Path(extra).read_bytes()).hexdigest()))
          manifest.write_text(''.join(f'{digest}  {file_name}\n' for file_name, digest in rows), encoding='utf-8')
          PY

          rm -f .github/workflows/batch37-login-rate-limit.yml

      - name: Commit login throttling hardening
        shell: bash
        run: |
          git config user.name "PlaceAI Hardening Bot"
          git config user.email "placeai-hardening@users.noreply.github.com"
          git add app/routers/access.py tests/test_login_rate_limit_integrity.py MANIFEST.sha256 .github/workflows/batch37-login-rate-limit.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Unify login rate-limit budget across roles"
          git push origin HEAD:fix/login-rate-limit-integrity-batch37
