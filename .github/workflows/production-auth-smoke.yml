name: PlaceAI Production Auth Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/production-auth-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-smoke:
    name: Verify production auth student and resume persistence
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Exercise live production
        env:
          PLACEAI_PRODUCTION_URL: https://placeai-rxpp.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          base="${PLACEAI_PRODUCTION_URL%/}"
          work="${RUNNER_TEMP}/placeai-auth-smoke"; mkdir -p "${work}"
          username="smoke_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          email="${username}@example.com"
          password="Smoke!Aa9_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          jar="${work}/cookies.txt"; oldjar="${work}/cookies-before-logout.txt"

          code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o "${work}/health.json" -w '%{http_code}' "${base}/health")"
          test "${code}" = 200
          jq -e '.status=="healthy" and .database=="ok" and .configuration=="ok"' "${work}/health.json" >/dev/null

          signup="$(jq -nc --arg u "$username" --arg e "$email" --arg p "$password" '{username:$u,email:$e,password:$p,role:"student"}')"
          code="$(curl -sS -L --connect-timeout 10 --max-time 25 -H 'Content-Type: application/json' -d "$signup" -o "${work}/signup.json" -w '%{http_code}' "${base}/auth/signup")"
          test "${code}" = 201
          jq -e --arg e "$email" '.email==$e and .role=="student" and .is_active==true' "${work}/signup.json" >/dev/null

          login="$(jq -nc --arg e "$email" --arg p "$password" '{email:$e,password:$p}')"
          code="$(curl -sS -L --connect-timeout 10 --max-time 25 -c "$jar" -b "$jar" -H 'Content-Type: application/json' -d "$login" -o "${work}/login.json" -w '%{http_code}' "${base}/auth/login-json")"
          test "${code}" = 200
          token="$(jq -er '.access_token|select(length>20)' "${work}/login.json")"

          code="$(curl -sS -L --connect-timeout 10 --max-time 25 -H "Authorization: Bearer ${token}" -o "${work}/me.json" -w '%{http_code}' "${base}/auth/me")"; test "$code" = 200
          code="$(curl -sS -L --connect-timeout 10 --max-time 25 -H "Authorization: Bearer ${token}" -o "${work}/profile.json" -w '%{http_code}' "${base}/students/profile")"; test "$code" = 200
          code="$(curl -sS -L --connect-timeout 10 --max-time 25 -H "Authorization: Bearer ${token}" -o "${work}/dashboard.json" -w '%{http_code}' "${base}/students/dashboard")"; test "$code" = 200

          update='{"full_name":"PlaceAI Production Smoke","skills":["Python","SQL"],"desired_roles":["Software Engineer"]}'
          code="$(curl -sS -L --connect-timeout 10 --max-time 25 -X PUT -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' -d "$update" -o "${work}/update.json" -w '%{http_code}' "${base}/students/profile")"; test "$code" = 200
          code="$(curl -sS -L --connect-timeout 10 --max-time 25 -H "Authorization: Bearer ${token}" -o "${work}/jobs.json" -w '%{http_code}' "${base}/students/jobs")"; test "$code" = 200; jq -e 'type=="array"' "${work}/jobs.json" >/dev/null

          cat > "${work}/resume.pdf" <<'PDF'
          %PDF-1.4
          1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj
          2 0 obj<</Type/Pages/Count 0/Kids[]>>endobj
          trailer<</Root 1 0 R>>
          %%EOF
          PDF
          code="$(curl -sS -L --connect-timeout 10 --max-time 25 -X POST -H "Authorization: Bearer ${token}" -F "file=@${work}/resume.pdf;type=application/pdf" -o "${work}/resume-upload.json" -w '%{http_code}' "${base}/students/resume")"; test "$code" = 201
          jq -e '.original_filename=="resume.pdf"' "${work}/resume-upload.json" >/dev/null
          code="$(curl -sS -L --connect-timeout 10 --max-time 25 -H "Authorization: Bearer ${token}" -o "${work}/resume-meta.json" -w '%{http_code}' "${base}/students/resume")"; test "$code" = 200
          code="$(curl -sS -L --connect-timeout 10 --max-time 25 -H "Authorization: Bearer ${token}" -o "${work}/resume-download.pdf" -w '%{http_code}' "${base}/students/resume/download")"; test "$code" = 200
          head -c 5 "${work}/resume-download.pdf" | grep -q '%PDF-'

          code="$(curl -sS -L --connect-timeout 10 --max-time 25 -c "$jar" -b "$jar" -H 'Content-Type: application/json' -d '{}' -o "${work}/refresh.json" -w '%{http_code}' "${base}/auth/refresh")"; test "$code" = 200
          token2="$(jq -er '.access_token|select(length>20)' "${work}/refresh.json")"; test "$token2" != "$token"
          cp "$jar" "$oldjar"
          code="$(curl -sS -L --connect-timeout 10 --max-time 25 -H "Authorization: Bearer ${token2}" -o "${work}/me2.json" -w '%{http_code}' "${base}/auth/me")"; test "$code" = 200
          code="$(curl -sS -L --connect-timeout 10 --max-time 25 -X POST -c "$jar" -b "$jar" -o "${work}/logout.txt" -w '%{http_code}' "${base}/auth/logout")"; test "$code" = 204
          code="$(curl -sS -L --connect-timeout 10 --max-time 25 -b "$oldjar" -H 'Content-Type: application/json' -d '{}' -o "${work}/revoked.json" -w '%{http_code}' "${base}/auth/refresh")"; test "$code" = 401

          printf 'smoke_email=%s\nhealth=ok\nsignup=ok\nlogin=ok\nstudent_core=ok\nresume_upload=ok\nresume_download=ok\nrefresh_rotation=ok\nlogout_revocation=ok\n' "$email" > "${work}/summary.txt"
          cat "${work}/summary.txt"
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placeai-production-auth-smoke-diagnostics
          path: ${{ runner.temp }}/placeai-auth-smoke
          retention-days: 3
