name: PlaceAI Production Auth Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/production-auth-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: placeai-production-auth-smoke
  cancel-in-progress: true

jobs:
  auth-smoke:
    name: Verify production signup login session and student core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Exercise live production authentication
        env:
          PLACEAI_PRODUCTION_URL: https://placeai-rxpp.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          base="${PLACEAI_PRODUCTION_URL%/}"
          work="${RUNNER_TEMP}/placeai-auth-smoke"
          mkdir -p "${work}"

          username="smoke_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          email="${username}@example.com"
          password="Smoke!Aa9_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          cookie_jar="${work}/cookies.txt"
          revoked_cookie_jar="${work}/cookies-before-logout.txt"

          request_json() {
            local method="$1" path="$2" body="$3" output="$4"
            shift 4
            curl --silent --show-error --location \
              --connect-timeout 10 --max-time 25 \
              --request "${method}" \
              --header 'Content-Type: application/json' \
              --output "${output}" --write-out '%{http_code}' \
              "$@" \
              --data "${body}" \
              "${base}${path}"
          }

          echo "1/10 health"
          health_code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 25 --output "${work}/health.json" --write-out '%{http_code}' "${base}/health")"
          test "${health_code}" = "200"
          jq -e '.status == "healthy" and .database == "ok" and .configuration == "ok"' "${work}/health.json" >/dev/null

          echo "2/10 signup"
          signup_body="$(jq -nc --arg username "${username}" --arg email "${email}" --arg password "${password}" '{username:$username,email:$email,password:$password,role:"student"}')"
          signup_code="$(request_json POST /auth/signup "${signup_body}" "${work}/signup.json")"
          test "${signup_code}" = "201"
          jq -e --arg email "${email}" '.email == $email and .role == "student" and .is_active == true' "${work}/signup.json" >/dev/null

          echo "3/10 login-json"
          login_body="$(jq -nc --arg email "${email}" --arg password "${password}" '{email:$email,password:$password}')"
          login_code="$(request_json POST /auth/login-json "${login_body}" "${work}/login.json" --cookie-jar "${cookie_jar}" --cookie "${cookie_jar}")"
          test "${login_code}" = "200"
          access_token="$(jq -er '.access_token | select(length > 20)' "${work}/login.json")"
          jq -e '.refresh_token == null and .token_type == "bearer" and .expires_in > 0' "${work}/login.json" >/dev/null

          echo "4/10 auth me"
          me_code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 25 --header "Authorization: Bearer ${access_token}" --output "${work}/me.json" --write-out '%{http_code}' "${base}/auth/me")"
          test "${me_code}" = "200"
          jq -e --arg email "${email}" '.email == $email and .role == "student"' "${work}/me.json" >/dev/null

          echo "5/10 student profile and dashboard"
          profile_code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 25 --header "Authorization: Bearer ${access_token}" --output "${work}/profile.json" --write-out '%{http_code}' "${base}/students/profile")"
          test "${profile_code}" = "200"
          dashboard_code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 25 --header "Authorization: Bearer ${access_token}" --output "${work}/dashboard.json" --write-out '%{http_code}' "${base}/students/dashboard")"
          test "${dashboard_code}" = "200"
          jq -e 'has("profile_completion") and has("applications") and has("has_resume")' "${work}/dashboard.json" >/dev/null

          echo "6/10 update student profile"
          update_body='{"full_name":"PlaceAI Production Smoke","skills":["Python","SQL"],"desired_roles":["Software Engineer"]}'
          update_code="$(request_json PUT /students/profile "${update_body}" "${work}/profile-update.json" --header "Authorization: Bearer ${access_token}")"
          test "${update_code}" = "200"
          jq -e '.full_name == "PlaceAI Production Smoke" and (.skills | index("Python") != null)' "${work}/profile-update.json" >/dev/null

          echo "7/10 browse jobs"
          jobs_code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 25 --header "Authorization: Bearer ${access_token}" --output "${work}/jobs.json" --write-out '%{http_code}' "${base}/students/jobs")"
          test "${jobs_code}" = "200"
          jq -e 'type == "array"' "${work}/jobs.json" >/dev/null

          echo "8/10 refresh rotation"
          refresh_code="$(request_json POST /auth/refresh '{}' "${work}/refresh.json" --cookie-jar "${cookie_jar}" --cookie "${cookie_jar}")"
          test "${refresh_code}" = "200"
          refreshed_access="$(jq -er '.access_token | select(length > 20)' "${work}/refresh.json")"
          test "${refreshed_access}" != "${access_token}"
          cp "${cookie_jar}" "${revoked_cookie_jar}"

          echo "9/10 refreshed session"
          me2_code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 25 --header "Authorization: Bearer ${refreshed_access}" --output "${work}/me-after-refresh.json" --write-out '%{http_code}' "${base}/auth/me")"
          test "${me2_code}" = "200"
          jq -e --arg email "${email}" '.email == $email' "${work}/me-after-refresh.json" >/dev/null

          echo "10/10 logout and revoke refresh"
          logout_code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 25 --request POST --cookie "${cookie_jar}" --cookie-jar "${cookie_jar}" --output "${work}/logout.txt" --write-out '%{http_code}' "${base}/auth/logout")"
          test "${logout_code}" = "204"
          revoked_code="$(request_json POST /auth/refresh '{}' "${work}/revoked-refresh.json" --cookie "${revoked_cookie_jar}")"
          test "${revoked_code}" = "401"

          printf 'smoke_email=%s\nhealth=ok\nsignup=ok\nlogin=ok\nme=ok\nstudent_profile=ok\nstudent_dashboard=ok\nprofile_update=ok\njobs=ok\nrefresh_rotation=ok\nlogout_revocation=ok\n' "${email}" > "${work}/summary.txt"
          cat "${work}/summary.txt"

      - name: Preserve smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placeai-production-auth-smoke-diagnostics
          path: ${{ runner.temp }}/placeai-auth-smoke
          if-no-files-found: warn
          retention-days: 3
