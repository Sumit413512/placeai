name: Run source cleanup

on:
  push:
    branches: ["fix/retire-demo-source"]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/retire-demo-source
      - name: Transform source
        run: python scripts/retire_demo_source.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app tests alembic
          node --check app/static/app.js
          node --check app/static/access-portal.js
          sha256sum -c MANIFEST.sha256
      - name: Commit transformed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Retire obsolete demo and simulated source paths"
          git push origin HEAD:fix/retire-demo-source
