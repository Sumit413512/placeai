name: PlaceAI hardening batch 32 compatibility fix

on:
  push:
    branches:
      - fix/production-hardening-batch-32

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-hardening-batch-32

      - name: Preserve existing pipeline API response contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('app/routers/hardening2.py')
          text = path.read_text(encoding='utf-8')
          old = '@router.post("/enterprise/drives/{drive_id}/pipeline", status_code=status.HTTP_201_CREATED)'
          new = '@router.post("/enterprise/drives/{drive_id}/pipeline")'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('pipeline route anchor missing')
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_production_hardening_batch32.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace(
              'datetime.utcnow() - timedelta(minutes=1)',
              'datetime.now(timezone.utc).replace(tzinfo=None) - timedelta(minutes=1)',
          ).replace(
              'datetime.utcnow() + timedelta(hours=1)',
              'datetime.now(timezone.utc).replace(tzinfo=None) + timedelta(hours=1)',
          )
          test_path.write_text(test_text, encoding='utf-8')

          manifest = Path('MANIFEST.sha256')
          rows = []
          for raw in manifest.read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              _digest, file_name = raw.split(maxsplit=1)
              file_name = file_name.strip()
              file_path = Path(file_name)
              rows.append((file_name, hashlib.sha256(file_path.read_bytes()).hexdigest()))
          manifest.write_text(''.join(f'{digest}  {file_name}\n' for file_name, digest in rows), encoding='utf-8')
          PY
          rm -f .github/workflows/batch32-compat-fix.yml

      - name: Commit compatibility fix
        shell: bash
        run: |
          git config user.name "PlaceAI Hardening Bot"
          git config user.email "placeai-hardening@users.noreply.github.com"
          git add app/routers/hardening2.py tests/test_production_hardening_batch32.py MANIFEST.sha256 .github/workflows/batch32-compat-fix.yml
          git commit -m "Preserve pipeline API status contract"
          git push origin HEAD:fix/production-hardening-batch-32
