name: PlaceAI batch 40 password reset observability

on:
  push:
    branches:
      - fix/password-reset-observability-batch40

permissions:
  contents: write

jobs:
  transform-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/password-reset-observability-batch40
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply observability hardening
        run: python scripts/batch40_email_observability.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Verify generated changes
        run: |
          set -euo pipefail
          sha256sum -c MANIFEST.sha256
          python -m compileall -q app tests alembic
          node --check app/static/app.js
          node --check app/static/access-portal.js
          node --check app/static/account-security.js
          node --check app/static/mock-interview.js
          node --check app/static/ui-state-fixes.js
          ruff check app tests alembic --select E9,F63,F7,F82
          pytest -q
          git diff --check
      - name: Commit generated hardening
        run: |
          git config user.name "PlaceAI Hardening Bot"
          git config user.email "placeai-hardening@users.noreply.github.com"
          git add MANIFEST.sha256 alembic/versions/20260911_0008_email_delivery_observability.py app/telemetry_models.py app/routers/auth.py app/routers/access.py app/static/app.js tests/test_password_reset_observability.py
          git commit -m "Add password reset delivery observability"
          git push origin HEAD:fix/password-reset-observability-batch40
