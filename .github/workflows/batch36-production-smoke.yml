name: PlaceAI Batch 36 Production Smoke

on:
  push:
    branches:
      - ops/batch36-production-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical production Google-auth boundary and health
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://placeai-rxpp.vercel.app"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$BASE/health" -o /tmp/health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          assert data.get('status') == 'healthy', data
          assert data.get('database') == 'ok', data
          assert data.get('configuration') == 'ok', data
          PY

          # Confirm the public endpoint exists and still enforces request validation.
          code=$(curl --silent --output /tmp/google-empty.json --write-out '%{http_code}' \
            -X POST "$BASE/auth/google" \
            -H 'Content-Type: application/json' \
            --data '{}')
          test "$code" = "422"

          # A structurally valid fake credential must never authenticate. Depending on
          # production Google configuration it returns 401 (configured) or 503 (disabled).
          code=$(curl --silent --output /tmp/google-fake.json --write-out '%{http_code}' \
            -X POST "$BASE/auth/google" \
            -H 'Content-Type: application/json' \
            --data '{"credential":"this-is-not-a-real-google-credential-token","role":"student"}')
          test "$code" = "401" -o "$code" = "503"
