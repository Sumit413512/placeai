name: Canonical Router Normalize

on:
  push:
    branches: [fix/canonical-router-ownership-20260912]
    paths: [.github/workflows/canonical-router-normalize.yml]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-router-ownership-20260912
      - name: Consolidate canonical router ownership
        run: |
          echo '# ' | base64 --decode > /tmp/normalize.py
          python /tmp/normalize.py
      - name: Refresh manifest
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              MANIFEST.sha256|.github/workflows/canonical-router-normalize.yml) continue ;;
            esac
            sha256sum "$file"
          done > MANIFEST.sha256
      - name: Commit normalization
        run: |
          git config user.name "placeai-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A app tests MANIFEST.sha256
          git commit -m "refactor: consolidate canonical router ownership"
          git push
