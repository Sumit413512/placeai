name: Brand Release Check

on:
  push:
    branches: [feat/brand-production-hardening-20260911]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted test dependencies
        run: pip install pytest==8.4.2
      - name: Branding regression tests
        run: pytest -q tests/test_brand_identity.py
      - name: JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/mock-interview.js
          node --check app/static/ui-state-fixes.js
          node --check pages/assets/placeai-pages.js
      - name: Refresh release manifest
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              MANIFEST.sha256|.github/workflows/brand-release-check.yml) continue ;;
            esac
            sha256sum "$file"
          done > MANIFEST.sha256
          git config user.name "placeai-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add MANIFEST.sha256
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh release manifest for official branding"
            git push
          fi
