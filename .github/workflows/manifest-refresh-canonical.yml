name: Canonical Router Manifest Refresh

on:
  push:
    branches: [fix/canonical-router-ownership-20260912]
    paths: [.github/workflows/manifest-refresh-canonical.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-router-ownership-20260912
      - name: Refresh release manifest
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              MANIFEST.sha256|.github/workflows/manifest-refresh-canonical.yml) continue ;;
            esac
            [ -f "$file" ] || continue
            sha256sum "$file"
          done > MANIFEST.sha256
      - name: Commit manifest
        run: |
          git config user.name "placeai-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add MANIFEST.sha256
          git commit -m "chore: refresh canonical router release manifest"
          git push
