name: One-time source retirement

on:
  push:
    branches:
      - fix/retire-demo-source

permissions:
  contents: write

jobs:
  retire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/retire-demo-source

      - name: Remove obsolete demo and simulated source paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'missing expected source: {label}')
              return text.replace(old, new, 1)

          # app.js: remove dormant fake notifications and replace the legacy demo-sales path.
          p = 'app/static/app.js'
          text = read(p)
          text, n = re.subn(
              r'\n  const demoNotificationsByRole = \{.*?\n  \};\n\n  async function updateNotificationBadge',
              '\n\n  async function updateNotificationBadge',
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('could not remove demoNotificationsByRole')
          text = replace_once(
              text,
              "['Platform','dashboard','Overview'],['Platform','organizations','Institutions'],['Sales','leads','Demo requests'],['Updates','notifications','Notifications']",
              "['Platform','dashboard','Overview'],['Platform','organizations','Institutions'],['Access','leads','Access requests'],['Updates','notifications','Notifications']",
              'platform nav demo label',
          )
          text = text.replace("['login-view','signup-view','demo-view','reset-view']", "['login-view','signup-view','reset-view']")
          text = text.replace("view === 'demo' ? 'demo-view' : ", '')
          text = replace_once(
              text,
              "pageHead('Platform overview','Tenant, adoption and sales-pipeline operating metrics.','Add institution','open-org-form')",
              "pageHead('Platform overview','Tenant and access-control operating metrics.','Add institution','open-org-form')",
              'platform overview subtitle',
          )
          text = replace_once(
              text,
              "<article class=\"metric-card\"><small>Sales leads</small><strong>${o.demo_requests}</strong><span>Open walkthrough requests</span></article>",
              "<article class=\"metric-card\"><small>Access requests</small><strong>${o.access_requests}</strong><span>Privileged workspace requests awaiting review</span></article>",
              'platform overview access metric',
          )
          branch_pattern = re.compile(
              r"\n    \} else if \(view === 'leads'\) \{.*?\n    \}\n  \}\n\n  function inputField",
              re.S,
          )
          branch_replacement = '''
    } else if (view === 'leads') {
      setPage('Access requests','Platform control'); setContextAction();
      const requests = await api('/platform/access-requests');
      $('#app-content').innerHTML = `${pageHead('Access requests','Privileged workspace requests submitted through the production access flow.')}${requests.length ? `<div class="data-panel"><div class="data-toolbar"><span class="table-secondary">${requests.length} requests</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Requester</th><th>Role</th><th>Organization</th><th>Context</th><th>Received</th><th>Status</th></tr></thead><tbody>${requests.map(r => `<tr><td><span class="table-primary">${esc(r.full_name)}</span><span class="table-secondary">${esc(r.work_email)}${r.phone ? ` · ${esc(r.phone)}` : ''}</span></td><td>${esc((r.requested_role || '').replaceAll('_',' '))}</td><td>${esc(r.organization_name || '—')}</td><td>${esc((r.message || '—').slice(0,120))}</td><td>${fmtDate(r.created_at)}</td><td><select class="filter-select access-status-select" data-id="${r.id}"><option value="new" ${r.status==='new'?'selected':''}>New</option><option value="under_review" ${r.status==='under_review'?'selected':''}>Under review</option><option value="approved" ${r.status==='approved'?'selected':''}>Approved</option><option value="rejected" ${r.status==='rejected'?'selected':''}>Rejected</option><option value="provisioned" ${r.status==='provisioned'?'selected':''}>Provisioned</option></select></td></tr>`).join('')}</tbody></table></div></div>` : emptyState('AR','No access requests','New privileged workspace requests will appear here after submission.')}`;
    }
  }

  function inputField'''
          text, n = branch_pattern.subn(branch_replacement, text, count=1)
          if n != 1:
              raise SystemExit('could not replace platform leads branch')
          text = text.replace(
              "if(e.target.classList.contains('lead-status-select')&&e.target.value){await api(`/platform/demo-requests/${e.target.dataset.id}`,{method:'PATCH',body:JSON.stringify({status:e.target.value})});toast('Lead status updated');}",
              "if(e.target.classList.contains('access-status-select')&&e.target.value){await api(`/platform/access-requests/${e.target.dataset.id}`,{method:'PATCH',body:JSON.stringify({status:e.target.value})});toast('Access request updated');}",
          )
          text, n = re.subn(
              r"\n      if\(f\.id==='demo-request-form'\)\{.*?\}\n      else if\(f\.id==='login-form'\)",
              "\n      if(f.id==='login-form')",
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('could not remove demo request submit branch')
          write(p, text)

          # index.html: remove fictional dashboards/candidates and the obsolete demo form.
          p = 'app/templates/index.html'
          html = read(p)
          html = html.replace('data-open-auth="demo"', 'data-open-access="request"')
          replacements = {
              'Request demo': 'Request access',
              'Book a product walkthrough': 'Request institution access',
              'See institution workflow': 'Request institution access',
              'Request a walkthrough': 'Request access',
              'e.g. northstar': 'provided by your institution',
              '74.8%': 'Live',
              'CGPA ≥ 7.0': 'Configurable CGPA',
              '2026 batch': 'Batch rules',
              'CSE · IT · ECE': 'Branch rules',
              'Applied <b>128</b>': 'Applied',
              'Shortlisted <b>42</b>': 'Shortlisted',
              'Interview <b>18</b>': 'Interview',
              'Offered <b>9</b>': 'Offered',
              '<strong>82</strong><small>readiness</small>': '<strong>Live</strong><small>readiness data</small>',
              'Resume <b>92%</b>': 'Resume',
              'Skills <b>78%</b>': 'Skills',
              'Interview <b>76%</b>': 'Interview',
              'Acme Technologies · Graduate Engineer': 'Approved employer · Campus role',
              'CGPA 7.0 · CSE/IT · 2026': 'Institution-defined eligibility rules',
              '842 → 514': 'Policy applied',
              '514 students notified in workspace': 'Eligible students notified in workspace',
          }
          for old, new in replacements.items():
              html = html.replace(old, new)

          hero_start = html.find('        <div class="hero-product" aria-label="PlaceAI dashboard preview">')
          if hero_start == -1:
              raise SystemExit('hero product block not found')
          hero_end = html.find('\n      </section>', hero_start)
          if hero_end == -1:
              raise SystemExit('hero product section end not found')
          hero = '''        <div class="hero-product" aria-label="PlaceAI production workspace model">
          <div class="production-surface-card"><div><span class="surface-kicker">Production workspace</span><h3>Real placement records, visible only after authenticated access.</h3><p>Student, recruiter, institution and platform workspaces are populated from production database records. Empty datasets stay empty until real activity exists.</p></div><div class="production-surface-grid"><div><strong>Student</strong><span>Profile, applications, drives and preparation records.</span></div><div><strong>Recruiter</strong><span>Authorized jobs and candidate pipelines.</span></div><div><strong>Institution Admin</strong><span>Institution-scoped placement operations.</span></div><div><strong>Platform Admin</strong><span>Restricted provisioning and access controls.</span></div></div></div>
        </div>'''
          html = html[:hero_start] + hero + html[hero_end:]

          role_start = html.find('        <div class="role-demo">')
          if role_start == -1:
              raise SystemExit('recruiter example block not found')
          role_end = html.find('\n      </section>', role_start)
          if role_end == -1:
              raise SystemExit('recruiter section end not found')
          role = '''        <div class="production-surface-card"><div><span class="surface-kicker">Controlled recruiter access</span><h3>Candidate records come only from real applications and approved institution workflows.</h3><p>Recruiter workspaces do not pre-populate fictional applicants, scores, résumés or hiring outcomes.</p></div><div class="production-surface-grid"><div><strong>Verified company profile</strong><span>Evidence-based trust review and institution linkage.</span></div><div><strong>Applicant pipeline</strong><span>Applied → shortlisted → interview → offer → hire.</span></div></div></div>'''
          html = html[:role_start] + role + html[role_end:]

          demo_start = html.find('        <div id="demo-view"')
          reset_start = html.find('        <div id="reset-view"', demo_start)
          if demo_start != -1 and reset_start != -1:
              html = html[:demo_start] + html[reset_start:]
          write(p, html)

          # access-portal.js: retire runtime-only demo removal now that source is clean.
          p = 'app/static/access-portal.js'
          portal = read(p)
          portal, n = re.subn(
              r"\n  function removeSimulatedPublicContent\(\) \{.*?\n  \}\n\n  function relabelPlatformNavigation",
              "\n  function relabelPlatformNavigation",
              portal,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('could not remove runtime simulated-content shim')
          portal = portal.replace('    removeSimulatedPublicContent();\n', '')
          portal = portal.replace('No simulated leads are displayed.', 'Only production access requests are displayed.')
          write(p, portal)

          # Backend: retire DemoRequest model/schema/router and count access requests instead.
          p = 'app/models.py'
          models = read(p)
          models, n = re.subn(r'\n\nclass DemoRequest\(Base\):.*?(?=\n\nclass |\Z)', '', models, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('could not remove DemoRequest model')
          write(p, models)

          p = 'app/schemas.py'
          schemas = read(p)
          schemas = replace_once(schemas, '    demo_requests: int\n', '    access_requests: int\n', 'overview schema access count')
          schemas, n = re.subn(r'\n\nclass DemoRequestCreate\(BaseModel\):.*?(?=\n\nclass AuditEventOut)', '', schemas, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('could not remove demo request schemas')
          write(p, schemas)

          p = 'app/routers/platform.py'
          platform = read(p)
          platform = platform.replace('from app.models import DemoRequest, Job, Organization, OrganizationType, RecruiterProfile, StudentProfile, User, UserRole', 'from app.access_models import AccessRequest\nfrom app.models import Job, Organization, OrganizationType, RecruiterProfile, User, UserRole')
          platform = platform.replace('from app.schemas import AdminUserProvision, DemoRequestOut, DemoRequestStatusUpdate, OrganizationCreate, OrganizationOut, PlatformOverviewOut, UserOut', 'from app.schemas import AdminUserProvision, OrganizationCreate, OrganizationOut, PlatformOverviewOut, UserOut')
          platform = replace_once(
              platform,
              '        demo_requests=db.query(DemoRequest).filter(DemoRequest.status != "lost").count(),',
              '        access_requests=db.query(AccessRequest).filter(AccessRequest.status.in_(["new", "under_review", "approved"])).count(),',
              'platform access count',
          )
          platform, n = re.subn(r'\n\n@router\.get\("/demo-requests".*\Z', '\n', platform, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('could not remove platform demo endpoints')
          write(p, platform)

          p = 'app/app.py'
          app = read(p)
          app = app.replace('public = _import_router("public")\n', '')
          app = app.replace('    public,\n', '')
          write(p, app)

          public_router = Path('app/routers/public.py')
          if public_router.exists():
              public_router.unlink()

          # Replace the duplicate legacy commercial-flow test with the real access-request pipeline.
          p = 'tests/test_core_flows.py'
          tests = read(p)
          new_test = '''def test_public_access_request_and_platform_review_pipeline():
    r = client.post("/public/access-requests", json={
        "requested_role": "institution_admin",
        "full_name": "Placement Operations Lead",
        "work_email": "placement.lead@college.example.com",
        "organization_name": "Example College",
        "message": "Requesting institution administration access for placement operations.",
    })
    assert r.status_code == 202, r.text
    request_id = r.json()["request_id"]

    platform = login("platform@placeai.example.com", "PlatformPass123!")
    r = client.get("/platform/access-requests", headers=auth(platform))
    assert r.status_code == 200 and any(x["id"] == request_id for x in r.json())

    r = client.patch(
        f"/platform/access-requests/{request_id}",
        headers=auth(platform),
        json={"status": "under_review", "review_note": "Institution ownership verification started"},
    )
    assert r.status_code == 200 and r.json()["status"] == "under_review"


'''
          tests, n = re.subn(
              r'def test_public_demo_request_and_platform_sales_pipeline\(\):.*?(?=def test_cross_institution_campus_job_isolation\(\):)',
              new_test,
              tests,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('could not replace legacy demo flow test')
          write(p, tests)

          # Remove obsolete demo endpoints from the Postman collection while preserving all real APIs.
          p = Path('PlaceAI_API.postman_collection.json')
          if p.exists():
              data = json.loads(p.read_text(encoding='utf-8'))
              def clean_items(items):
                  result = []
                  for item in items or []:
                      if isinstance(item, dict) and 'item' in item:
                          item['item'] = clean_items(item.get('item', []))
                          if item['item']:
                              result.append(item)
                          continue
                      raw = ''
                      if isinstance(item, dict):
                          raw = str(item.get('request', {}).get('url', {}).get('raw', ''))
                          name = str(item.get('name', ''))
                      else:
                          name = ''
                      if '/demo-requests' in raw or 'demo request' in name.lower():
                          continue
                      result.append(item)
                  return result
              data['item'] = clean_items(data.get('item', []))
              p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Add an Alembic retirement migration; production DDL is applied separately through Supabase.
          migration = Path('alembic/versions/20260909_0006_retire_demo_requests.py')
          migration.write_text('''"""Retire obsolete demo request storage.\n\nRevision ID: 20260909_0006\nRevises: 20260909_0005\n"""\nfrom alembic import op\nimport sqlalchemy as sa\nfrom sqlalchemy import inspect\n\nrevision = "20260909_0006"\ndown_revision = "20260909_0005"\nbranch_labels = None\ndepends_on = None\n\n\ndef upgrade() -> None:\n    if "demo_requests" in inspect(op.get_bind()).get_table_names():\n        op.drop_table("demo_requests")\n\n\ndef downgrade() -> None:\n    if "demo_requests" not in inspect(op.get_bind()).get_table_names():\n        op.create_table(\n            "demo_requests",\n            sa.Column("id", sa.String(), primary_key=True),\n            sa.Column("contact_name", sa.String(length=200), nullable=False),\n            sa.Column("work_email", sa.String(length=320), nullable=False),\n            sa.Column("organization_name", sa.String(length=250), nullable=False),\n            sa.Column("role_title", sa.String(length=180), nullable=True),\n            sa.Column("phone", sa.String(length=40), nullable=True),\n            sa.Column("student_count", sa.Integer(), nullable=True),\n            sa.Column("message", sa.Text(), nullable=True),\n            sa.Column("status", sa.String(length=40), nullable=False, server_default="new"),\n            sa.Column("created_at", sa.DateTime(), nullable=False, server_default=sa.text("CURRENT_TIMESTAMP")),\n        )\n''', encoding='utf-8')

          # Remove the one-time workflow itself from the final branch.
          Path('.github/workflows/source-demo-retirement.yml').unlink(missing_ok=True)

          # Refresh MANIFEST.sha256 for existing listed paths, remove deleted paths, and add the new migration.
          manifest = Path('MANIFEST.sha256')
          listed = []
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              _, path = line.split('  ', 1)
              if Path(path).exists():
                  listed.append(path)
          if str(migration) not in listed:
              listed.append(str(migration))
          listed = sorted(dict.fromkeys(listed))
          out = []
          for path in listed:
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              out.append(f'{digest}  {path}')
          manifest.write_text('\n'.join(out) + '\n', encoding='utf-8')

          # Final source assertions: no obsolete demo API/model or fictional production identities remain.
          banned = [
              'demoNotificationsByRole', '/public/demo-requests', '/platform/demo-requests',
              'DemoRequest', 'data-open-auth="demo"', 'id="demo-view"',
              'Northstar Institute', 'Acme Technologies', 'Aarav Shah', 'Riya Mehta',
              'Vihaan Kumar', 'Nisha Singh', 'Avanta Labs', 'Nexora Systems', 'Quantforge',
          ]
          production_files = [
              Path('app/static/app.js'), Path('app/static/access-portal.js'), Path('app/templates/index.html'),
              Path('app/app.py'), Path('app/models.py'), Path('app/schemas.py'), Path('app/routers/platform.py'),
          ]
          joined = '\n'.join(x.read_text(encoding='utf-8') for x in production_files if x.exists())
          leftovers = [x for x in banned if x in joined]
          if leftovers:
              raise SystemExit(f'obsolete production markers remain: {leftovers}')
          PY

      - name: Validate transformed source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app tests alembic
          node --check app/static/app.js
          node --check app/static/access-portal.js
          sha256sum -c MANIFEST.sha256

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Retire obsolete demo and simulated source paths"
          git push origin HEAD:fix/retire-demo-source
