name: Refresh Vercel manifest hash

on:
  push:
    branches:
      - ops/vercel-build-conservation-20260911

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/vercel-build-conservation-20260911
      - name: Refresh manifest hash
        run: |
          HASH=$(sha256sum vercel.json | cut -d' ' -f1)
          sed -i -E "s/^[0-9a-f]{64}  vercel\.json$/${HASH}  vercel.json/" MANIFEST.sha256
          grep '  vercel.json$' MANIFEST.sha256
      - name: Commit manifest if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh vercel manifest hash'
          git push
