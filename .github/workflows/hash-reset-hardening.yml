name: Reset hardening hash diagnostic

on:
  push:
    branches:
      - fix/reset-availability-access-reconcile-20260911

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emit SHA-256
        run: sha256sum app/app.py tests/test_password_reset_service_availability.py
