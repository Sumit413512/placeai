name: Reset Recovery Patch Check

on:
  push:
    branches: [fix/reset-probe-20260911]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check app/static/ui-state-fixes.js
      - name: Recovery guard assertions
        run: |
          grep -q "placeai.password.reset.v1" app/static/ui-state-fixes.js
          grep -q "auth/reset-password" app/static/ui-state-fixes.js
          grep -q "Uppercase letter" app/static/ui-state-fixes.js
          grep -q "Passwords match" app/static/ui-state-fixes.js
      - name: Manifest hash
        run: sha256sum app/static/ui-state-fixes.js
