name: PlaceAI batch 40 cleanup

on:
  push:
    branches:
      - fix/password-reset-observability-batch40

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/password-reset-observability-batch40
      - name: Remove temporary transformation tooling and refresh manifest
        run: |
          set -euo pipefail
          rm -f scripts/batch40_email_observability.py
          rm -f .github/workflows/batch40-email-observability.yml
          rm -f .github/workflows/batch40-fix-transformer.yml
          rm -f .github/workflows/batch40-cleanup.yml
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          excluded = {
              'MANIFEST.sha256',
              'scripts/batch40_email_observability.py',
              '.github/workflows/batch40-email-observability.yml',
              '.github/workflows/batch40-fix-transformer.yml',
              '.github/workflows/batch40-cleanup.yml',
          }
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          entries = []
          for name in sorted(tracked):
              if name in excluded or not Path(name).is_file():
                  continue
              entries.append(f"{hashlib.sha256(Path(name).read_bytes()).hexdigest()}  {name}")
          Path('MANIFEST.sha256').write_text('\n'.join(entries) + '\n', encoding='utf-8')
          PY
          sha256sum -c MANIFEST.sha256
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "PlaceAI Hardening Bot"
          git config user.email "placeai-hardening@users.noreply.github.com"
          git add -A
          git commit -m "Clean temporary batch 40 tooling"
          git push origin HEAD:fix/password-reset-observability-batch40
