name: PlaceAI batch 44 mock history route ownership

on:
  push:
    branches:
      - fix/mock-history-route-ownership-batch44

permissions:
  contents: write

jobs:
  consolidate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mock-history-route-ownership-batch44
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Consolidate mock interview history ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('app/app.py')
          app = app_path.read_text(encoding='utf-8')
          shadow_filter = '''if mock_interview is not None:
    mock_interview.router.routes = [
        route for route in mock_interview.router.routes
        if getattr(route, "path", "") != "/mock-interview/history"
    ]

'''
          if shadow_filter not in app:
              raise SystemExit('mock history bootstrap filter anchor not found')
          app_path.write_text(app.replace(shadow_filter, '', 1), encoding='utf-8')

          compat_path = Path('app/routers/interview_compat.py')
          compat = compat_path.read_text(encoding='utf-8')
          helper = '''def _evaluation_dict(raw: str | None) -> dict:
    try:
        value = json.loads(raw or "{}")
    except (json.JSONDecodeError, TypeError):
        return {}
    return value if isinstance(value, dict) else {}


'''
          if helper not in compat:
              raise SystemExit('compat evaluation helper anchor not found')
          compat = compat.replace(helper, '', 1)
          route_start = compat.find('@router.get("/mock-interview/history")')
          if route_start == -1:
              raise SystemExit('compat mock history route anchor not found')
          compat = compat[:route_start].rstrip() + '\n'
          compat_path.write_text(compat, encoding='utf-8')

          test_path = Path('tests/test_interview_compatibility.py')
          test = test_path.read_text(encoding='utf-8')
          addition = '''

def test_mock_interview_history_has_one_canonical_route_owner():
    mock_source = open("app/routers/mock_interview.py", encoding="utf-8").read()
    compat_source = open("app/routers/interview_compat.py", encoding="utf-8").read()
    app_source = open("app/app.py", encoding="utf-8").read()

    assert '@router.get("/history")' in mock_source
    assert '@router.get("/mock-interview/history")' not in compat_source
    assert 'getattr(route, "path", "") != "/mock-interview/history"' not in app_source

    routes = [
        route
        for route in app.routes
        if getattr(route, "path", None) == "/mock-interview/history"
        and "GET" in (getattr(route, "methods", set()) or set())
    ]
    assert len(routes) == 1
'''
          if 'def test_mock_interview_history_has_one_canonical_route_owner():' not in test:
              test_path.write_text(test.rstrip() + addition + '\n', encoding='utf-8')
          PY
      - name: Refresh release manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          manifest = Path('MANIFEST.sha256')
          entries = {}
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if '  ' in line:
                  _, path = line.split('  ', 1)
                  entries[path] = line
          for path in ('app/app.py', 'app/routers/interview_compat.py', 'tests/test_interview_compatibility.py'):
              entries[path] = f'{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}'
          manifest.write_text('\n'.join(entries[path] for path in sorted(entries)) + '\n', encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Verify consolidation
        run: |
          set -euo pipefail
          sha256sum -c MANIFEST.sha256
          python -m compileall -q app tests alembic
          node --check app/static/api-errors.js
          node --check app/static/app.js
          node --check app/static/access-portal.js
          node --check app/static/account-security.js
          node --check app/static/mock-interview.js
          ruff check app tests alembic --select E9,F63,F7,F82
          pytest -q
          ! grep -q 'getattr(route, "path", "") != "/mock-interview/history"' app/app.py
          ! grep -q '@router.get("/mock-interview/history")' app/routers/interview_compat.py
          git diff --check
      - name: Commit canonical mock history ownership
        run: |
          git config user.name "PlaceAI Hardening Bot"
          git config user.email "placeai-hardening@users.noreply.github.com"
          git add MANIFEST.sha256 app/app.py app/routers/interview_compat.py tests/test_interview_compatibility.py
          git commit -m "Consolidate mock interview history route ownership"
          git push origin HEAD:fix/mock-history-route-ownership-batch44
