name: PlaceAI hardening batch one-time normalization

on:
  push:
    branches:
      - "fix/production-hardening-batch-31"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/production-hardening-batch-31

      - name: Normalize tests and release manifest
        run: python scripts/one_time_hardening_normalize.py

      - name: Commit normalized release branch
        run: |
          git config user.name "PlaceAI Hardening Bot"
          git config user.email "placeai-hardening@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize hardening regressions and release manifest"
          git push origin HEAD:fix/production-hardening-batch-31
