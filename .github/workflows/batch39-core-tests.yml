name: PlaceAI batch 39 core-flow rotation test update

on:
  push:
    branches:
      - fix/provisioned-password-rotation-batch39

permissions:
  contents: write

jobs:
  update-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provisioned-password-rotation-batch39
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update sequential core-flow credentials
        run: python scripts/batch39_update_core_tests.py
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run full test suite
        run: |
          pytest -q
          sha256sum -c MANIFEST.sha256
          git diff --check
      - name: Commit test adaptation
        run: |
          git config user.name "PlaceAI Hardening Bot"
          git config user.email "placeai-hardening@users.noreply.github.com"
          git add tests/test_core_flows.py MANIFEST.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Adapt core flows to mandatory password rotation"
          git push origin HEAD:fix/provisioned-password-rotation-batch39
