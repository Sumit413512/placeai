name: Reconstruct PlaceAI source

on:
  push:
    branches:
      - repair/placeai-v313-production-hardening
    paths:
      - 'bundle8/**'
      - '.github/workflows/reconstruct-placeai-source.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct validated runtime payload
        shell: bash
        run: |
          set -euo pipefail
          test -d bundle8
          cat bundle8/part*.txt | tr -d '\r\n' | base64 --decode > /tmp/placeai_payload.xz
          xz -dc /tmp/placeai_payload.xz > /tmp/placeai_payload
          mkdir -p /tmp/placeai_extract

          if tar -tf /tmp/placeai_payload >/dev/null 2>&1; then
            tar -xf /tmp/placeai_payload -C /tmp/placeai_extract
          elif python -m zipfile -t /tmp/placeai_payload >/dev/null 2>&1; then
            python -m zipfile -e /tmp/placeai_payload /tmp/placeai_extract
          else
            echo 'Validated payload is neither tar nor zip after XZ decompression.' >&2
            file /tmp/placeai_payload >&2 || true
            exit 1
          fi

          root="$(find /tmp/placeai_extract -type f -name pyproject.toml -printf '%h\n' | head -n 1)"
          if [ -z "$root" ]; then
            root="$(find /tmp/placeai_extract -type f -name requirements.txt -printf '%h\n' | head -n 1)"
          fi
          test -n "$root"
          test -d "$root/app"

          rsync -a --delete --exclude='.git/' --exclude='.github/' "$root/" ./
          test -f app/app.py
          test -f requirements.txt
          test -f vercel.json

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app
          node --check app/static/app.js

      - name: Commit reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reconstruct PlaceAI source tree from validated runtime [skip ci]'
          git push origin HEAD
