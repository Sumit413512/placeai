name: PlaceAI OOXML Manifest Once

on:
  push:
    branches: [hardening/ooxml-upload-bounds]
    paths:
      - '.github/workflows/ooxml-manifest-once.yml'

permissions:
  contents: write

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run focused tests, synchronize manifest, remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m pip install -q -r requirements-dev.txt
          python -m pytest -q tests/test_storage_security.py
          python -m compileall -q app tests

          git rm .github/workflows/ooxml-manifest-once.yml
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import subprocess

          files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          files = [p for p in files if p not in {'MANIFEST.sha256', '.github/workflows/ooxml-manifest-once.yml'}]
          lines = []
          for rel in sorted(files):
              path = Path(rel)
              if path.is_file():
                  lines.append(f"{sha256(path.read_bytes()).hexdigest()}  {rel}")
          Path('MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          sha256sum -c MANIFEST.sha256
          git add MANIFEST.sha256
          git commit -m 'Synchronize OOXML upload hardening manifest'
          git push origin HEAD:hardening/ooxml-upload-bounds
