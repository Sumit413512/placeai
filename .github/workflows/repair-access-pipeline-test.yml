name: Repair Access Pipeline Test

on:
  push:
    branches: [fix/retire-legacy-demo-system]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/retire-legacy-demo-system
      - name: Update retired demo pipeline test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          p = Path('tests/test_core_flows.py')
          s = p.read_text(encoding='utf-8')
          pattern = r"def test_public_demo_request_and_platform_sales_pipeline\(\):.*?(?=\n\ndef test_cross_institution_campus_job_isolation\(\):)"
          replacement = '''def test_public_access_request_and_platform_review_pipeline():
              r = client.post("/public/access-requests", json={
                  "requested_role": "institution_admin",
                  "full_name": "Priya Placement",
                  "work_email": "priya@college.example.com",
                  "organization_name": "Example College",
                  "message": "We want controlled access for our placement office.",
              })
              assert r.status_code == 202, r.text
              request = r.json()
              assert request["status"] == "new"
              request_id = request["request_id"]

              platform = login("platform@placeai.example.com", "PlatformPass123!")
              r = client.get("/platform/access-requests", headers=auth(platform))
              assert r.status_code == 200 and any(x["id"] == request_id for x in r.json())

              r = client.patch(
                  f"/platform/access-requests/{request_id}",
                  headers=auth(platform),
                  json={"status": "under_review", "review_note": "Validated institutional request."},
              )
              assert r.status_code == 200 and r.json()["status"] == "under_review"
          '''
          ns, count = re.subn(pattern, replacement.rstrip(), s, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one legacy test block, found {count}')
          p.write_text(ns, encoding='utf-8')

          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          m = Path('MANIFEST.sha256')
          lines = m.read_text(encoding='utf-8').splitlines()
          updated = []
          found = False
          for line in lines:
              if line.endswith('  tests/test_core_flows.py'):
                  updated.append(f'{digest}  tests/test_core_flows.py')
                  found = True
              else:
                  updated.append(line)
          if not found:
              raise SystemExit('Manifest entry for tests/test_core_flows.py not found')
          m.write_text('\n'.join(updated) + '\n', encoding='utf-8')
          PY
          git diff --check
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'PlaceAI Production Repair'
          git config user.email 'skj1200519@gmail.com'
          git add tests/test_core_flows.py MANIFEST.sha256
          git commit -m 'Align tests with production access-request pipeline'
          git push origin HEAD:fix/retire-legacy-demo-system
