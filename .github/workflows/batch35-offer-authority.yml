name: PlaceAI offer authority normalization

on:
  push:
    branches:
      - fix/offer-authority-batch35

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/offer-authority-batch35

      - name: Enforce offer decision authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          backend = Path('app/routers/hardening2.py')
          text = backend.read_text(encoding='utf-8')
          old_const = 'PLACED_OFFER_STATUSES = {"accepted", "joining_confirmed", "joined"}\n'
          new_const = '''PLACED_OFFER_STATUSES = {"accepted", "joining_confirmed", "joined"}\nVALID_OFFER_STATUSES = {"issued", "accepted", "declined", "withdrawn", "joining_confirmed", "joined"}\nSTUDENT_OFFER_DECISIONS = {"accepted", "declined"}\nOPERATOR_OFFER_STATUSES = VALID_OFFER_STATUSES - STUDENT_OFFER_DECISIONS\n'''
          if old_const in text and 'VALID_OFFER_STATUSES' not in text:
              text = text.replace(old_const, new_const, 1)

          old_block = '''    if current_user.role == UserRole.student:\n        if data.status not in {"accepted", "declined"}:\n            raise HTTPException(status_code=403, detail="Students may only accept or decline offers")\n        payload = {"status": data.status}\n    else:\n        payload = data.model_dump(exclude_unset=True)\n'''
          new_block = '''    normalized_status = None\n    if data.status is not None:\n        normalized_status = data.status.strip().lower()\n        if not normalized_status or normalized_status not in VALID_OFFER_STATUSES:\n            raise HTTPException(status_code=422, detail="Unsupported offer status")\n\n    if current_user.role == UserRole.student:\n        if normalized_status not in STUDENT_OFFER_DECISIONS:\n            raise HTTPException(status_code=403, detail="Students may only accept or decline offers")\n        payload = {"status": normalized_status}\n    else:\n        if normalized_status in STUDENT_OFFER_DECISIONS:\n            raise HTTPException(status_code=403, detail="Only the student may accept or decline an offer")\n        payload = data.model_dump(exclude_unset=True)\n        if "status" in payload:\n            if normalized_status not in OPERATOR_OFFER_STATUSES:\n                raise HTTPException(status_code=422, detail="Unsupported offer status")\n            payload["status"] = normalized_status\n'''
          if old_block not in text:
              raise SystemExit('offer authorization block anchor missing')
          text = text.replace(old_block, new_block, 1)
          backend.write_text(text, encoding='utf-8')

          frontend = Path('app/static/app.js')
          js = frontend.read_text(encoding='utf-8')
          institution_options = '<option value="issued">Issued</option><option value="accepted">Accepted</option><option value="declined">Declined</option><option value="withdrawn">Withdrawn</option><option value="joining_confirmed">Joining confirmed</option>'
          replacement_options = '<option value="issued">Issued</option><option value="withdrawn">Withdrawn</option><option value="joining_confirmed">Joining confirmed</option><option value="joined">Joined</option>'
          if institution_options not in js:
              raise SystemExit('institution offer status controls anchor missing')
          js = js.replace(institution_options, replacement_options, 1)

          recruiter_options = '<option value="issued">Issued</option><option value="withdrawn">Withdrawn</option><option value="joining_confirmed">Joining confirmed</option>'
          recruiter_replacement = '<option value="issued">Issued</option><option value="withdrawn">Withdrawn</option><option value="joining_confirmed">Joining confirmed</option><option value="joined">Joined</option>'
          if recruiter_options in js:
              js = js.replace(recruiter_options, recruiter_replacement, 1)
          frontend.write_text(js, encoding='utf-8')

          manifest = Path('MANIFEST.sha256')
          rows = []
          seen = set()
          for raw in manifest.read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              _digest, file_name = raw.split(maxsplit=1)
              file_name = file_name.strip()
              file_path = Path(file_name)
              if not file_path.is_file():
                  raise SystemExit(f'Manifest path missing: {file_name}')
              rows.append((file_name, hashlib.sha256(file_path.read_bytes()).hexdigest()))
              seen.add(file_name)
          extra = 'tests/test_offer_authority.py'
          if extra not in seen:
              rows.append((extra, hashlib.sha256(Path(extra).read_bytes()).hexdigest()))
          manifest.write_text(''.join(f'{digest}  {file_name}\n' for file_name, digest in rows), encoding='utf-8')
          PY

          rm -f .github/workflows/batch35-offer-authority.yml

      - name: Commit offer authority hardening
        shell: bash
        run: |
          git config user.name "PlaceAI Hardening Bot"
          git config user.email "placeai-hardening@users.noreply.github.com"
          git add app/routers/hardening2.py app/static/app.js tests/test_offer_authority.py MANIFEST.sha256 .github/workflows/batch35-offer-authority.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Enforce student offer decision authority"
          git push origin HEAD:fix/offer-authority-batch35
