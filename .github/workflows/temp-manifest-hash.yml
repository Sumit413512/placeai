name: Temporary Manifest Hash

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/templates/index.html'
      - 'index.html'
      - '.github/workflows/temp-manifest-hash.yml'

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compute exact SHA256
        run: sha256sum app/templates/index.html index.html
